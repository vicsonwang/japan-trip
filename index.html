<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>日本自由行助手 (雲端同步版)</title>
  <style>
    :root {
      --primary-color: #007aff;
      --primary-light: #eef6ff;
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --text-color: #1c1c1e;
      --sub-text: #8e8e93;
      --border-color: #e5e5ea;
      --danger-color: #ff3b30;
      --success-color: #34c759;
      --warning-color: #ff9500;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 90px;
      font-size: 16px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      background: rgba(249, 249, 249, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      font-size: 1.1rem;
      z-index: 100;
    }

    .header-btn {
      background: none;
      border: none;
      color: var(--primary-color);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
    }

    .container {
      padding: 15px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Views & Tabs Switcher */
    .view, .tab-content {
      display: none;
    }
    .view.active, .tab-content.active {
      display: block;
    }

    /* Card Style */
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid rgba(0,0,0,0.03);
    }

    /* Form Controls */
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--sub-text);
      margin-bottom: 6px;
      font-weight: 500;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      background-color: #fff;
      appearance: none;
      -webkit-appearance: none;
    }
    .form-row {
      display: flex;
      gap: 10px;
    }
    .form-row .form-group {
      flex: 1;
    }

    /* 折疊表單設計 */
    .collapsible-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      font-weight: 600;
      color: var(--primary-color);
    }
    .collapsible-body {
      display: none;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px dashed var(--border-color);
    }
    .collapsible-body.show {
      display: block;
    }

    /* Buttons */
    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      text-align: center;
    }
    .btn-sm {
      padding: 5px 10px;
      font-size: 0.8rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-edit {
      background-color: #e5e5ea;
      color: #1c1c1e;
    }
    .btn-danger {
      background-color: rgba(255, 59, 48, 0.1);
      color: var(--danger-color);
    }
    .btn-action-group {
      display: flex;
      gap: 6px;
    }

    /* Bottom Navigation Bar */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(249, 249, 249, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
      z-index: 1000;
    }
    .nav-item {
      flex: 1;
      text-align: center;
      color: var(--sub-text);
      font-size: 0.75rem;
      text-decoration: none;
      border: none;
      background: none;
      cursor: pointer;
    }
    .nav-item.active {
      color: var(--primary-color);
      font-weight: 600;
    }
    .nav-icon {
      font-size: 1.4rem;
      display: block;
      margin-bottom: 2px;
    }

    /* 行程美化卡片 */
    .sch-card {
      position: relative;
      border-left: 4px solid var(--primary-color);
      padding-left: 14px;
    }
    .sch-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .day-badge {
      background: var(--primary-color);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .date-text {
      font-size: 0.85rem;
      color: var(--sub-text);
      margin-left: 6px;
      font-weight: 500;
    }
    .sch-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-color);
      margin-bottom: 6px;
    }
    .sch-time {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.85rem;
      color: var(--primary-color);
      background: var(--primary-light);
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .sch-note {
      font-size: 0.85rem;
      color: #636366;
      margin-top: 6px;
      background: #f8f8fa;
      padding: 6px 10px;
      border-radius: 6px;
    }

    /* Proxy Buy Specifics */
    .buy-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .buy-item.bought .sch-title {
      text-decoration: line-through;
      color: var(--sub-text);
    }
    .checkbox-custom {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .checkbox-custom.checked {
      background-color: var(--success-color);
      border-color: var(--success-color);
      color: white;
    }
    .checkbox-custom.checked::after {
      content: '✓';
      font-size: 14px;
      font-weight: bold;
    }

    .rate-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--primary-light);
      padding: 10px 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .rate-bar input {
      width: 80px;
      padding: 4px 8px;
      text-align: right;
    }

    .trip-card {
      cursor: pointer;
      border-left: 5px solid var(--primary-color);
    }

    .sync-status {
      font-size: 0.75rem;
      color: var(--success-color);
      text-align: center;
      margin-bottom: 10px;
    }


    .photo-preview {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .photo-preview img {
      width: 86px;
      height: 86px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }
    .photo-thumb {
      width: 58px;
      height: 58px;
      object-fit: cover;
      border-radius: 9px;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    .buy-row {
      display: grid;
      grid-template-columns: 28px minmax(0,1fr) auto;
      gap: 8px;
      align-items: center;
    }
    .buy-main-line {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      flex-wrap: wrap;
    }
    .buy-main-line .buy-name {
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .buy-meta {
      font-size: 0.78rem;
      color: var(--sub-text);
      margin-top: 3px;
      white-space: nowrap;
    }
    .buy-actions {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
    .owner-summary {
      cursor: pointer;
      border-left: 4px solid var(--primary-color);
    }
    .owner-summary-head {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }
    .owner-total {
      font-size:.78rem;
      color:var(--sub-text);
      margin-top:3px;
    }
    .owner-money {
      font-weight:800;
      color:#d32f2f;
      white-space:nowrap;
    }
    .owner-items {
      display:none;
      margin-top:10px;
      border-top:1px dashed var(--border-color);
      padding-top:9px;
    }
    .owner-items.show { display:block; }
    .buy-item-line {
      display:grid;
      grid-template-columns:24px minmax(0,1fr) auto;
      gap:7px;
      align-items:center;
      padding:7px 0;
      border-bottom:1px solid #f0f0f2;
    }
    .buy-item-line:last-child { border-bottom:none; }
    @media (max-width: 520px) {
      .buy-actions .btn-sm {
        padding: 6px 7px;
        font-size: .72rem;
      }
      .buy-row { grid-template-columns: 26px minmax(0,1fr) auto; }
      .buy-main-line .buy-name { max-width: 155px; }
      .photo-thumb { width:50px; height:50px; }
    }

    /* Modal 彈窗樣式 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 20px;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal-card {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--sub-text);
      cursor: pointer;
    }

    /* === 2026 UI 更新：置頂快速工具列 === */
    .quick-toolbar {
      position: sticky;
      top: 61px;
      z-index: 90;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      margin: -15px -15px 12px;
      background: rgba(249,249,249,.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .quick-toolbar::-webkit-scrollbar { display:none; }
    .quick-btn {
      flex: 0 0 auto;
      border: 1px solid var(--border-color);
      background: #fff;
      color: var(--text-color);
      border-radius: 9px;
      padding: 7px 10px;
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .quick-btn.primary { color: var(--primary-color); }
    .quick-btn.sync { color: var(--success-color); }
    .quick-btn.active { background: var(--primary-light); border-color: #b8d8ff; }
    .quick-panel {
      display:none;
      background:#fff;
      border:1px solid var(--border-color);
      border-radius:12px;
      padding:12px;
      margin-bottom:12px;
      box-shadow:0 4px 14px rgba(0,0,0,.06);
    }
    .quick-panel.show { display:block; }
    .quick-panel-title {
      font-size:.82rem; font-weight:700; color:var(--text-color);
      margin-bottom:8px;
    }
    .rate-reference {
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      background:var(--primary-light); border-radius:9px; padding:9px 10px;
      font-size:.82rem; margin-bottom:8px;
    }
    .rate-reference b { color:var(--primary-color); }
    .rate-edit-row { display:flex; align-items:center; gap:8px; }
    .rate-edit-row input { flex:1; width:auto; padding:8px 10px; }
    .mini-note { font-size:.72rem; color:var(--sub-text); margin-top:5px; }

    /* === 行程：專案管理 / 日期群組 / 時間軸 === */
    .schedule-day {
      background:#fff; border:1px solid var(--border-color); border-radius:14px;
      margin-bottom:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.035);
    }
    .schedule-day-header {
      display:flex; align-items:center; gap:10px; padding:12px 13px; cursor:pointer;
      background:linear-gradient(180deg,#fff,#fafafa);
    }
    .schedule-day-arrow { color:var(--primary-color); font-weight:800; width:16px; }
    .schedule-day-main { flex:1; min-width:0; }
    .schedule-day-title { font-size:.98rem; font-weight:750; }
    .schedule-day-sub { font-size:.74rem; color:var(--sub-text); margin-top:2px; }
    .schedule-progress { width:64px; height:6px; background:#e9e9ee; border-radius:99px; overflow:hidden; }
    .schedule-progress span { display:block; height:100%; background:var(--primary-color); border-radius:99px; }
    .schedule-items { display:none; padding:0 12px 10px 20px; border-top:1px solid var(--border-color); }
    .schedule-items.show { display:block; }
    .timeline-item {
      display:grid; grid-template-columns:72px 14px 1fr auto; gap:8px; align-items:stretch;
      padding:10px 0; border-bottom:1px solid #f0f0f3;
    }
    .timeline-item:last-child { border-bottom:none; }
    .timeline-time { font-size:.76rem; font-weight:750; color:var(--primary-color); padding-top:2px; }
    .timeline-line { position:relative; width:14px; }
    .timeline-line::before { content:''; position:absolute; left:6px; top:5px; bottom:-12px; width:2px; background:#dbeafe; }
    .timeline-item:last-child .timeline-line::before { bottom:5px; }
    .timeline-line::after { content:''; position:absolute; left:3px; top:4px; width:8px; height:8px; border-radius:50%; background:var(--primary-color); }
    .timeline-content { min-width:0; }
    .timeline-title { font-size:.93rem; font-weight:700; line-height:1.3; }
    .timeline-note { font-size:.74rem; color:#636366; margin-top:3px; }
    .timeline-actions { display:flex; gap:4px; align-items:flex-start; }
    .timeline-actions .btn-sm { padding:4px 7px; }

    /* === 代購：委託人群組 === */
    .owner-group {
      background:#fff; border:1px solid var(--border-color); border-radius:14px;
      margin-bottom:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.035);
    }
    .owner-header {
      display:flex; align-items:center; justify-content:space-between; gap:8px;
      padding:11px 13px; cursor:pointer; background:#fafafa;
    }
    .owner-title { font-weight:750; font-size:.95rem; }
    .owner-meta { font-size:.72rem; color:var(--sub-text); }
    .owner-items { display:none; }
    .owner-items.show { display:block; }
    .buy-row {
      display:grid; grid-template-columns:28px 1fr auto; gap:8px; align-items:center;
      padding:9px 11px; border-top:1px solid #f0f0f3;
    }
    .buy-main { min-width:0; }
    .buy-line {
      display:flex; align-items:center; gap:7px; min-width:0; white-space:nowrap; overflow:hidden;
    }
    .buy-name { font-weight:650; overflow:hidden; text-overflow:ellipsis; }
    .buy-detail { font-size:.72rem; color:var(--sub-text); margin-top:2px; white-space:nowrap; }
    .buy-total { font-size:.82rem; font-weight:750; color:#d32f2f; white-space:nowrap; }
    .buy-actions { display:flex; gap:4px; }
    .tag { display:inline-block; padding:2px 6px; border-radius:5px; background:#f0f0f5; color:#636366; font-size:.65rem; }
    .sync-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--success-color); margin-right:4px; }

    @media (max-width:480px) {
      .timeline-item { grid-template-columns:64px 14px 1fr; }
      .timeline-actions { grid-column:3; margin-top:3px; }
      .buy-row { grid-template-columns:28px 1fr; }
      .buy-total, .buy-actions { grid-column:2; }
      .buy-actions { justify-content:flex-end; }
    }

  </style>
</head>
<body>

  <!-- Google 登入遮罩 -->
  <div id="login-overlay" class="modal-overlay show" style="z-index:3000; background:rgba(242,242,247,.98);">
    <div class="modal-card" style="text-align:center; max-width:420px;">
      <div style="font-size:3rem; margin-bottom:10px;">🇯🇵</div>
      <div style="font-size:1.5rem; font-weight:800; margin-bottom:8px;">日本自由行助手</div>
      <div style="color:var(--sub-text); line-height:1.6; margin-bottom:22px;">登入 Google 後即可同步旅程，並使用 Google Drive 儲存照片。</div>
      <button id="google-login-btn" class="btn" style="background:#fff; color:#1c1c1e; border:1px solid var(--border-color); box-shadow:0 2px 8px rgba(0,0,0,.08);">
        <span style="font-weight:800; color:#4285f4; margin-right:8px;">G</span> 使用 Google 帳號登入
      </button>
      <div id="login-error" style="color:var(--danger-color); font-size:.8rem; margin-top:12px;"></div>
    </div>
  </div>

  <!-- Top Header -->
  <header>
    <button id="back-to-trips-btn" class="header-btn" style="visibility: hidden;" onclick="showTripsView()">
      ‹ 返回旅程
    </button>
    <span id="header-title">日本自由行</span>
    <div id="user-area" style="min-width:120px; text-align:right; font-size:.75rem; color:var(--sub-text);">未登入</div>
  </header>

  <div class="container">
    <div id="sync-notice" class="sync-status">🟢 雲端連線同步中</div>

    <!-- 第一頁：旅程選擇頁 (首頁) -->
    <div id="view-trips" class="view active">
      <div class="card">
        <div class="collapsible-header" onclick="toggleCollapsible('trip-form-body', 'trip-form-icon')">
          <span>➕ 新增自由行程</span>
          <span id="trip-form-icon">＋</span>
        </div>
        <div id="trip-form-body" class="collapsible-body">
          <form id="trip-form">
            <div class="form-group">
              <label>旅程名稱</label>
              <input type="text" id="trip-name" placeholder="例如：東京 6 天 5 夜自由行" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>開始日期</label>
                <input type="date" id="trip-start-date" required>
              </div>
              <div class="form-group">
                <label>結束日期</label>
                <input type="date" id="trip-end-date" required>
              </div>
            </div>
            <button type="submit" class="btn">建立旅程</button>
          </form>
        </div>
      </div>

      <div class="card" style="margin-top:14px;">
        <div class="collapsible-header" onclick="toggleCollapsible('join-trip-body', 'join-trip-icon')">
          <span>🔗 加入家庭旅程</span>
          <span id="join-trip-icon">＋</span>
        </div>
        <div id="join-trip-body" class="collapsible-body">
          <form id="join-trip-form">
            <div class="form-group">
              <label>旅程邀請碼</label>
              <input type="text" id="join-code" maxlength="6" placeholder="例如：AB12CD" style="text-transform:uppercase;letter-spacing:2px;font-weight:700;">
            </div>
            <button type="submit" class="btn">加入旅程</button>
          </form>
        </div>
      </div>

      <h3 style="margin: 15px 5px 10px; font-size: 0.9rem; color: var(--sub-text);">我的旅程清單</h3>
      <div id="trips-list"></div>
    </div>

    <!-- 第二頁：行程與代購細項 -->
    <div id="view-detail" class="view">
      <!-- 置頂快速工具列：平時只佔一排，按下才展開 -->
      <div id="quick-toolbar" class="quick-toolbar">
        <button class="quick-btn sync" type="button"><span class="sync-dot"></span>同步中</button>
        <button class="quick-btn primary" type="button" onclick="toggleQuickPanel('add-panel')">＋ 新增</button>
        <button id="quick-rate-btn" class="quick-btn" type="button" onclick="toggleQuickPanel('rate-panel')">💴 匯率</button>
        <button id="quick-filter-btn" class="quick-btn" type="button" onclick="toggleQuickPanel('filter-panel')">☷ 篩選</button>
      </div>

      <div id="add-panel" class="quick-panel">
        <div class="quick-panel-title">新增</div>
        <div id="add-schedule-shortcut">
          <button class="btn" type="button" onclick="openAddSchedule()">＋ 新增行程細項</button>
        </div>
        <div id="add-buy-shortcut" style="display:none;">
          <button class="btn" type="button" onclick="openAddBuy()">＋ 新增代購商品</button>
        </div>
      </div>

      <div id="rate-panel" class="quick-panel">
        <div class="quick-panel-title">💴 日幣換算台幣</div>
        <div class="rate-reference">
          <span>今日參考匯率 <b id="rate-reference-date">2026-09-16</b></span>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

  <script>
    // ==============================
    // Firebase 設定
    // ==============================
    const firebaseConfig = {
      apiKey: "AIzaSyDCNbwIV1iMoxwlPL7a4xEbMwpMv75sOak",
      authDomain: "japan-trip-701cd.firebaseapp.com",
      projectId: "japan-trip-701cd",
      storageBucket: "japan-trip-701cd.firebasestorage.app",
      messagingSenderId: "811979985418",
      appId: "1:811979985418:web:e3e93cf122f780af4585f3",
      measurementId: "G-62BVTK2QEZ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // ==============================
    // 全域狀態
    // ==============================
    let trips = [];
    let currentTripId = null;
    let tripsUnsubscribe = null;
    let rateUnsubscribe = null;
    let googleDriveAccessToken = null;

    const TODAY_REFERENCE_RATE = 0.2057;
    const TODAY_REFERENCE_DATE = '2026-09-16';
    let exchangeRate = TODAY_REFERENCE_RATE;

    // ==============================
    // 共用工具
    // ==============================
    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    function getCurrentTrip() {
      return trips.find(t => t.id === currentTripId) || null;
    }

    function showError(message, error) {
      console.error(message, error || '');
      alert(message + (error?.message ? '\n\n' + error.message : ''));
    }

    // ==============================
    // 登入 / 旅程同步
    // ==============================
    document.getElementById('google-login-btn').addEventListener('click', async () => {
      const btn = document.getElementById('google-login-btn');
      const errorEl = document.getElementById('login-error');
      errorEl.textContent = '';
      btn.disabled = true;
      btn.innerHTML = 'Google 登入中…';

      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.addScope('https://www.googleapis.com/auth/drive.file');
        const result = await auth.signInWithPopup(provider);
        googleDriveAccessToken = result.credential?.accessToken || null;
      } catch (err) {
        console.error('Google 登入失敗：', err);
        errorEl.textContent = '登入失敗：' + (err.message || err);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span style="font-weight:800; color:#4285f4; margin-right:8px;">G</span> 使用 Google 帳號登入';
      }
    });

    auth.onAuthStateChanged(user => {
      const overlay = document.getElementById('login-overlay');
      const userArea = document.getElementById('user-area');
      const syncNotice = document.getElementById('sync-notice');

      if (user) {
        overlay.classList.remove('show');
        userArea.innerHTML = `<span style="color:var(--success-color);">●</span> ${escapeHtml(user.displayName || user.email || 'Google 使用者')}`;
        syncNotice.textContent = '🟢 雲端連線同步中';
        startTripSync(user);
        startRateSync();
      } else {
        overlay.classList.add('show');
        userArea.textContent = '未登入';
        trips = [];
        currentTripId = null;
        googleDriveAccessToken = null;
        stopTripSync();
        stopRateSync();
        renderTripsList();
        syncNotice.textContent = '⚪ 尚未登入';
      }
    });

    function stopTripSync() {
      if (tripsUnsubscribe) {
        tripsUnsubscribe();
        tripsUnsubscribe = null;
      }
    }

    function startTripSync(user) {
      stopTripSync();

      if (!user) {
        trips = [];
        renderTripsList();
        return;
      }

      console.log('開始同步旅程：', user.uid);
      const savedTripId = localStorage.getItem('currentTripId');

      tripsUnsubscribe = db.collection('trips')
        .where('memberUids', 'array-contains', user.uid)
        .onSnapshot(snapshot => {
          trips = [];
          snapshot.forEach(doc => trips.push({ id: doc.id, ...doc.data() }));

          trips.sort((a, b) => (a.startDate || '').localeCompare(b.startDate || ''));
          renderTripsList();

          if (!currentTripId && savedTripId) {
            const savedTrip = trips.find(t => t.id === savedTripId);
            if (savedTrip) {
              openTripDetail(savedTrip.id, savedTrip);
            } else {
              localStorage.removeItem('currentTripId');
            }
          }

          if (currentTripId) {
            const currentTrip = trips.find(t => t.id === currentTripId);
            if (!currentTrip) {
              localStorage.removeItem('currentTripId');
              showTripsView();
              return;
            }
            renderSchedules();
            updateOwnerFilterOptions();
            renderBuyList();
          }
        }, error => {
          console.error('旅程同步失敗：', error);
          document.getElementById('sync-notice').textContent = '🔴 雲端同步失敗：' + (error.message || '');
        });
    }

    function stopRateSync() {
      if (rateUnsubscribe) {
        rateUnsubscribe();
        rateUnsubscribe = null;
      }
    }

    function startRateSync() {
      stopRateSync();
      rateUnsubscribe = db.collection('settings').doc('rate').onSnapshot(doc => {
        exchangeRate = doc.exists ? (parseFloat(doc.data().val) || TODAY_REFERENCE_RATE) : TODAY_REFERENCE_RATE;
        const input = document.getElementById('exchange-rate');
        if (input) input.value = exchangeRate;
        if (currentTripId) renderBuyList();
      }, error => {
        console.warn('匯率同步失敗：', error);
      });
    }

    // ==============================
    // UI / Modal / 分頁
    // ==============================
    function toggleCollapsible(bodyId, iconId) {
      const body = document.getElementById(bodyId);
      const icon = document.getElementById(iconId);
      if (!body) return;
      const isOpen = body.classList.contains('show');
      body.classList.toggle('show', !isOpen);
      if (icon) icon.innerText = isOpen ? '＋' : '✕';
    }

    function closeModal(modalId) {
      document.getElementById(modalId)?.classList.remove('show');
    }

    function showTripsView() {
      currentTripId = null;
      localStorage.removeItem('currentTripId');
      document.getElementById('view-trips').classList.add('active');
      document.getElementById('view-detail').classList.remove('active');
      document.getElementById('detail-nav-bar').style.display = 'none';
      document.getElementById('back-to-trips-btn').style.visibility = 'hidden';
      document.getElementById('header-title').innerText = '日本自由行';
      renderTripsList();
    }

    function openTripDetail(tripId, tripData = null) {
      let trip = trips.find(t => t.id === tripId);

      if (!trip && tripData) {
        trip = { id: tripId, ...tripData };
        const idx = trips.findIndex(t => t.id === tripId);
        if (idx >= 0) trips[idx] = trip;
        else trips.push(trip);
      }

      if (!trip) {
        alert('旅程資料還在同步中，請稍候再試。');
        return;
      }

      currentTripId = tripId;
      localStorage.setItem('currentTripId', tripId);
      document.getElementById('view-trips').classList.remove('active');
      document.getElementById('view-detail').classList.add('active');
      document.getElementById('detail-nav-bar').style.display = 'flex';
      document.getElementById('back-to-trips-btn').style.visibility = 'visible';
      document.getElementById('header-title').innerText = trip.name || '日本自由行';
      switchTab('schedule');
      setTimeout(setScheduleDefaults, 0);
    }

    function toggleQuickPanel(panelId) {
      const panel = document.getElementById(panelId);
      if (!panel) return;
      const isOpen = panel.classList.contains('show');
      document.querySelectorAll('.quick-panel').forEach(p => p.classList.remove('show'));
      document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
      if (!isOpen) {
        panel.classList.add('show');
        const btn = document.querySelector(`[onclick="toggleQuickPanel('${panelId}')"]`);
        if (btn) btn.classList.add('active');
      }
    }

    function openAddSchedule() {
      document.querySelectorAll('.quick-panel').forEach(p => p.classList.remove('show'));
      document.getElementById('sch-form-body').classList.add('show');
      document.getElementById('add-panel').classList.add('show');
      setScheduleDefaults();
      document.getElementById('sch-date').focus();
    }

    function openAddBuy() {
      document.querySelectorAll('.quick-panel').forEach(p => p.classList.remove('show'));
      document.getElementById('buy-form-body').classList.add('show');
      document.getElementById('add-panel').classList.add('show');
      document.getElementById('buy-name').focus();
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('#detail-nav-bar .nav-item').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.quick-panel').forEach(el => el.classList.remove('show'));
      document.querySelectorAll('.quick-btn').forEach(el => el.classList.remove('active'));

      const isSchedule = tabName === 'schedule';
      document.getElementById(isSchedule ? 'tab-schedule' : 'tab-buy').classList.add('active');
      document.querySelectorAll('#detail-nav-bar .nav-item')[isSchedule ? 0 : 1].classList.add('active');
      document.getElementById('quick-rate-btn').style.display = isSchedule ? 'none' : 'block';
      document.getElementById('quick-filter-btn').style.display = isSchedule ? 'none' : 'block';
      document.getElementById('add-schedule-shortcut').style.display = isSchedule ? 'block' : 'none';
      document.getElementById('add-buy-shortcut').style.display = isSchedule ? 'none' : 'block';

      if (isSchedule) renderSchedules();
      else { updateOwnerFilterOptions(); renderBuyList(); }
    }

    // ==============================
    // 旅程建立 / 加入
    // ==============================
    function generateInviteCode(length = 6) {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < length; i++) code += chars[Math.floor(Math.random() * chars.length)];
      return code;
    }

    document.getElementById('trip-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const user = auth.currentUser;
      if (!user) return alert('請先登入 Google 帳號。');

      const name = document.getElementById('trip-name').value.trim();
      const startDate = document.getElementById('trip-start-date').value;
      const endDate = document.getElementById('trip-end-date').value;
      if (endDate < startDate) return alert('結束日期不能早於開始日期。');

      const btn = this.querySelector('button[type="submit"]');
      btn.disabled = true;

      try {
        const inviteCode = generateInviteCode();
        const tripRef = await db.collection('trips').add({
          name, startDate, endDate, inviteCode, code: inviteCode,
          schedules: [], buyItems: [],
          ownerUid: user.uid,
          ownerName: user.displayName || user.email || 'Google 使用者',
          memberUids: [user.uid],
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        await db.collection('tripInvites').doc(inviteCode).set({
          tripId: tripRef.id,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        this.reset();
        toggleCollapsible('trip-form-body', 'trip-form-icon');
        localStorage.setItem('currentTripId', tripRef.id);
        const localTrip = { id: tripRef.id, name, startDate, endDate, inviteCode, code: inviteCode, schedules: [], buyItems: [], ownerUid: user.uid, ownerName: user.displayName || user.email || 'Google 使用者', memberUids: [user.uid] };
        trips.push(localTrip);
        openTripDetail(tripRef.id, localTrip);
      } catch (err) {
        showError('建立旅程失敗', err);
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('join-trip-form')?.addEventListener('submit', async function(e) {
      e.preventDefault();
      const user = auth.currentUser;
      if (!user) return alert('請先登入 Google 帳號。');

      const input = document.getElementById('join-code');
      const btn = this.querySelector('button[type="submit"]');
      const code = input.value.trim().toUpperCase();
      if (!code) return;
      btn.disabled = true;

      try {
        const inviteSnap = await db.collection('tripInvites').doc(code).get();
        if (!inviteSnap.exists) throw new Error('找不到此邀請碼。');
        const tripId = inviteSnap.data().tripId;
        if (!tripId) throw new Error('邀請碼資料不完整。');

        const tripRef = db.collection('trips').doc(tripId);
        const tripSnap = await tripRef.get();
        if (!tripSnap.exists) throw new Error('旅程不存在。');
        const trip = { id: tripSnap.id, ...tripSnap.data() };
        const members = Array.isArray(trip.memberUids) ? [...trip.memberUids] : [];
        if (!members.includes(user.uid)) members.push(user.uid);

        await tripRef.update({ memberUids: members });
        trip.memberUids = members;
        trips = [...trips.filter(t => t.id !== tripId), trip];
        currentTripId = tripId;
        localStorage.setItem('currentTripId', tripId);
        input.value = '';
        openTripDetail(tripId, trip);
      } catch (err) {
        showError('加入旅程失敗', err);
      } finally {
        btn.disabled = false;
      }
    });

    async function deleteTrip(id, e) {
      e.stopPropagation();
      const trip = trips.find(t => t.id === id);
      if (!trip) return;
      if (trip.ownerUid && auth.currentUser && trip.ownerUid !== auth.currentUser.uid) {
        return alert('只有旅程建立者可以刪除旅程。');
      }
      if (!confirm('確定要刪除整個旅程嗎？')) return;
      try {
        if (trip.inviteCode) await db.collection('tripInvites').doc(trip.inviteCode).delete().catch(() => {});
        await db.collection('trips').doc(id).delete();
        if (currentTripId === id) showTripsView();
      } catch (err) { showError('刪除旅程失敗', err); }

    function showPhotoPreview(inputId, previewId, existingUrl='') {
      const input = document.getElementById(inputId);
      const preview = document.getElementById(previewId);
      if (!input || !preview) return;
      preview.innerHTML = existingUrl ? `<img src="${escapeAttr(existingUrl)}" alt="照片預覽">` : '';
      input.onchange = () => {

        const reader = new FileReader();
        reader.onload = e => { preview.innerHTML = `<img src="${escapeAttr(e.target.result)}" alt="照片預覽">`; };
        reader.readAsDataURL(file);
      };
    }

    async function ensureGoogleDriveToken() {
      if (googleDriveAccessToken) return googleDriveAccessToken;
      if (!auth.currentUser) throw new Error('請先登入 Google 帳號');
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.addScope('https://www.googleapis.com/auth/drive.file');
      const result = await auth.currentUser.reauthenticateWithPopup(provider);
      googleDriveAccessToken = result.credential?.accessToken || null;
      if (!googleDriveAccessToken) throw new Error('沒有取得 Google Drive 授權');
      return googleDriveAccessToken;
    }

    async function driveApi(url, options = {}) {
      const token = await ensureGoogleDriveToken();
      const headers = Object.assign({}, options.headers || {}, { Authorization: `Bearer ${token}` });
      const response = await fetch(url, Object.assign({}, options, { headers }));
      if (response.status === 401) {
        googleDriveAccessToken = null;
        throw new Error('Google Drive 授權已過期，請重新上傳一次');
      }
      if (!response.ok) {
        let detail = '';
        try { detail = await response.text(); } catch (_) {}
        throw new Error(`Google Drive 錯誤 ${response.status}${detail ? ': ' + detail.slice(0,180) : ''}`);
      }
      return response;
    }

    async function getOrCreateDriveFolder(folderName) {
      const q = encodeURIComponent(`name = '${folderName.replace(/'/g, "\\'")}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false`);
      const list = await driveApi(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)&pageSize=10`);
      const data = await list.json();
      if (data.files?.length) return data.files[0].id;
      const create = await driveApi('https://www.googleapis.com/drive/v3/files?fields=id,name', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ name:folderName, mimeType:'application/vnd.google-apps.folder' })
      });
      return (await create.json()).id;
    }

    async function uploadPhoto(file, folder, id) {
      if (!file) return null;
      const compressed = await compressImage(file, 1600, 0.82);
      const safeName = (file.name || 'photo.jpg').replace(/[^a-zA-Z0-9._-]/g, '_').replace(/\.[^.]+$/, '') + '.jpg';
      const subFolder = await getOrCreateDriveFolder(folder === 'schedulePhotos' ? '行程照片' : '代購照片');
      const metadata = { name:`${id}_${Date.now()}_${safeName}`, mimeType:'image/jpeg', parents:[subFolder] };
      const boundary = 'japan_trip_' + Date.now();
      const body = new Blob([
        `--${boundary}\r\n`, 'Content-Type: application/json; charset=UTF-8\r\n\r\n', JSON.stringify(metadata),
        `\r\n--${boundary}\r\n`, 'Content-Type: image/jpeg\r\n\r\n', compressed, `\r\n--${boundary}--`
      ]);
      const response = await driveApi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink', {
        method:'POST', headers:{'Content-Type':`multipart/related; boundary=${boundary}`}, body
      });
      const uploaded = await response.json();

      // 某些 Google Workspace 管理員會禁止 anyone 權限。
      // 上傳成功後若無法公開分享，仍保留 fileId，但照片可能只有同帳號可見。
      try {
       
      } catch (permissionError) {
        console.warn('Google Drive 公開分享權限設定失敗，照片仍已上傳：', permissionError);
      }

      return { fileId:uploaded.id, photoUrl:`https://drive.google.com/thumbnail?id=${uploaded.id}&sz=w1200` };
    }

    function compressImage(file, maxSide, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
            canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('照片壓縮失敗')), 'image/jpeg', quality);
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function renderSchedules() {
      const listEl=document.getElementById('schedule-list'); if(!listEl) return;

      const groups={}; sorted.forEach(item=>(groups[item.date] ||= []).push(item));
