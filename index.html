<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>日本自由行規劃</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Noto Sans TC", "Microsoft JhengHei", sans-serif; background: #f5f5f7; color: #1d1d1f; }
    body { padding-bottom: env(safe-area-inset-bottom); }
    button, input, select, textarea { font-family: inherit; }
    button { cursor: pointer; }
    /* Login */
    #login-overlay { position: fixed; inset: 0; z-index: 3000; background: rgba(245, 245, 247, 0.98); display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-card { width: min(420px, 100%); background: #fff; border-radius: 28px; padding: 40px 28px; text-align: center; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12); }
    .login-logo { width: 76px; height: 76px; margin: 0 auto 20px; border-radius: 22px; background: linear-gradient(135deg, #ff5f6d, #ffc371); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 34px; font-weight: 800; }
    .login-card h1 { margin: 0 0 8px; font-size: 26px; }
    .login-card p { margin: 0 0 28px; color: #86868b; line-height: 1.6; font-size: 14px; }
    #google-login-btn { width: 100%; min-height: 52px; border: 1px solid #d2d2d7; background: #fff; border-radius: 14px; font-size: 16px; font-weight: 600; color: #1d1d1f; transition: 0.2s; }
    #google-login-btn:hover { background: #f5f5f7; }
    #google-login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    #login-error { margin-top: 14px; color: #ff3b30; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
    /* Header */
    .app-header { position: sticky; top: 0; z-index: 500; background: rgba(245, 245, 247, 0.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0, 0, 0, 0.06); }
    .header-inner { width: min(1100px, calc(100% - 32px)); margin: 0 auto; min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-icon { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #ff5f6d, #ff9966); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; flex: 0 0 auto; }
    .brand-text { min-width: 0; }
    .brand-title { font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-subtitle { font-size: 11px; color: #86868b; }
    .user-area { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .user-name { max-width: 130px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; color: #6e6e73; }
    .logout-btn { border: 0; background: #fff; color: #ff3b30; padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 600; }
    /* Main */
    .app-main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 110px; }
    .view { display: none; }
    .view.active { display: block; }
    .page-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
    .page-title { margin: 0; font-size: 28px; letter-spacing: -0.5px; }
    .page-subtitle { margin: 6px 0 0; color: #86868b; font-size: 13px; }
    /* Buttons */
    .btn { border: 0; border-radius: 12px; min-height: 42px; padding: 0 16px; font-size: 14px; font-weight: 700; transition: 0.18s; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: #007aff; color: #fff; }
    .btn-primary:hover { background: #006ee6; }
    .btn-secondary { background: #f2f2f7; color: #1d1d1f; }
    .btn-danger { background: #fff0ef; color: #ff3b30; }
    .btn-small { min-height: 34px; padding: 0 11px; font-size: 12px; border-radius: 9px; }
    .icon-btn { width: 38px; height: 38px; padding: 0; border: 0; border-radius: 11px; background: #f2f2f7; font-size: 17px; }
    /* Trip list */
    .trip-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .trip-card { background: #fff; border-radius: 20px; padding: 22px; border: 1px solid rgba(0, 0, 0, 0.05); box-shadow: 0 8px 28px rgba(0, 0, 0, 0.04); transition: 0.2s; cursor: pointer; }
    .trip-card:hover { transform: translateY(-2px); box-shadow: 0 14px 35px rgba(0, 0, 0, 0.08); }
    .trip-card-header { display: flex; justify-content: space-between; gap: 12px; }
    .trip-name { font-size: 19px; font-weight: 800; line-height: 1.35; }
    .trip-date { color: #86868b; font-size: 13px; margin-top: 8px; }
    .trip-owner { margin-top: 18px; font-size: 12px; color: #86868b; }
    .trip-code { display: inline-flex; margin-top: 12px; background: #f2f2f7; border-radius: 8px; padding: 5px 8px; font-size: 11px; color: #6e6e73; letter-spacing: 0.4px; }
    .empty-state { background: #fff; border-radius: 20px; padding: 48px 24px; text-align: center; color: #86868b; }
    .empty-state-icon { font-size: 42px; margin-bottom: 12px; }
    /* Trip detail */
    .trip-detail-header { margin-bottom: 20px; }
    .back-row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .trip-detail-title { font-size: 28px; font-weight: 800; margin: 0; }
    .trip-detail-date { margin-top: 6px; color: #86868b; font-size: 13px; }
    /* Toolbar */
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .toolbar-item { background: #fff; border-radius: 11px; min-height: 38px; padding: 0 12px; display: flex; align-items: center; gap: 7px; font-size: 12px; color: #6e6e73; border: 1px solid rgba(0, 0, 0, 0.05); }
    .toolbar-item strong { color: #1d1d1f; }
    .filter-panel { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 18px; display: none; border: 1px solid rgba(0, 0, 0, 0.05); }
    .filter-panel.show { display: block; }
    .filter-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .filter-label { display: block; font-size: 11px; color: #86868b; margin-bottom: 5px; }
    
    /* ＝＝＝ Swipe Actions (Req 1) ＝＝＝ */
    .swipe-container { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -ms-overflow-style: none; width: 100%; }
    .swipe-container::-webkit-scrollbar { display: none; }
    .swipe-content { flex: 0 0 100%; min-width: 100%; scroll-snap-align: start; }
    .swipe-actions { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 0 12px; scroll-snap-align: end; }
    
    /* Schedule specific */
    .schedule-day { margin-bottom: 22px; }
    .day-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .day-badge { min-width: 56px; padding: 6px 10px; border-radius: 10px; background: #1d1d1f; color: #fff; text-align: center; font-size: 12px; font-weight: 800; }
    .day-date { font-size: 14px; font-weight: 700; }
    .day-toggle { margin-left: auto; border: 0; background: transparent; color: #86868b; font-size: 13px; }
    .schedule-list { display: flex; flex-direction: column; gap: 9px; }
    .schedule-swipe { border-radius: 16px; border: 1px solid rgba(0, 0, 0, 0.04); background: #f2f2f7; }
    .schedule-card { background: #fff; border-radius: 16px; padding: 14px; display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 13px; align-items: start; }
    .schedule-time { font-size: 12px; color: #007aff; font-weight: 800; line-height: 1.45; }
    .schedule-place { font-size: 15px; font-weight: 800; line-height: 1.4; word-break: break-word; }
    .schedule-meta { margin-top: 4px; font-size: 11px; color: #86868b; }
    .schedule-action { width: 34px; height: 34px; border: 0; border-radius: 10px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); font-size: 15px; }

    /* Buy specific */
    .buy-owner-section { margin-bottom: 20px; }
    .buy-owner-header { background: #fff; border-radius: 15px 15px 0 0; padding: 13px 15px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid #f0f0f2; }
    .buy-owner-title { font-size: 14px; font-weight: 800; }
    .buy-owner-summary { color: #86868b; font-size: 11px; }
    .buy-owner-items { background: #fff; border-radius: 0 0 15px 15px; overflow: hidden; }
    .buy-swipe { border-bottom: 1px solid #f2f2f7; background: #f2f2f7; }
    .buy-swipe:last-child { border-bottom: none; }
    .buy-item-line { background: #fff; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 9px; align-items: center; padding: 11px 13px; }
    .buy-item-body { min-width: 0; display: flex; align-items: center; gap: 9px; }
    .buy-item-content { min-width: 0; flex: 1; }
    .buy-item-name { font-size: 13px; font-weight: 700; line-height: 1.35; word-break: break-word; }
    .buy-item-meta { margin-top: 3px; color: #86868b; font-size: 10px; line-height: 1.4; }
    .buy-item-price { margin-top: 3px; font-size: 11px; color: #1d1d1f; font-weight: 700; }
    .buy-action { width: 34px; height: 34px; border: 0; border-radius: 10px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); font-size: 15px; }
    .checkbox-custom { width: 20px; height: 20px; border-radius: 6px; border: 2px solid #c7c7cc; background: #fff; position: relative; cursor: pointer; }
    .checkbox-custom.checked { background: #34c759; border-color: #34c759; }
    .checkbox-custom.checked::after { content: "✓"; color: #fff; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; }
    
    /* Photos */
    .photo-thumb { width: 58px; height: 58px; flex: 0 0 58px; border-radius: 10px; object-fit: cover; background: #f2f2f7; display: block; }
    .photo-loading { display: flex; align-items: center; justify-content: center; color: #8e8e93; font-size: 19px; }
    .photo-preview { margin-top: 10px; min-height: 0; }
    .photo-preview img { display: block; width: 100%; max-width: 220px; max-height: 180px; object-fit: cover; border-radius: 12px; background: #f2f2f7; }
    .photo-status { margin-top: 7px; color: #86868b; font-size: 11px; }
    /* Form */
    .form-card { background: #fff; border-radius: 18px; padding: 18px; margin-bottom: 18px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    .form-group { min-width: 0; }
    .form-group.full { grid-column: 1 / -1; }
    .form-label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 700; color: #6e6e73; }
    .form-input, .form-select, .form-textarea { width: 100%; border: 1px solid #d2d2d7; background: #fff; border-radius: 11px; min-height: 42px; padding: 9px 11px; outline: none; font-size: 14px; color: #1d1d1f; }
    .form-textarea { min-height: 90px; resize: vertical; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: #007aff; box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1); }
    .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    /* Modal */
    .modal { position: fixed; inset: 0; z-index: 2000; background: rgba(0, 0, 0, 0.42); display: none; align-items: flex-end; justify-content: center; padding: 0; }
    .modal.show { display: flex; }
    .modal-card { width: min(650px, 100%); max-height: 92vh; overflow-y: auto; background: #fff; border-radius: 24px 24px 0 0; padding: 22px; animation: modalUp 0.2s ease; }
    @keyframes modalUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .modal-title { margin: 0; font-size: 21px; font-weight: 800; }
    .modal-close { width: 36px; height: 36px; border: 0; border-radius: 50%; background: #f2f2f7; font-size: 20px; }
    /* Quick panel */
    .quick-panel { display: none; background: #fff; border-radius: 16px; padding: 15px; margin-bottom: 16px; border: 1px solid rgba(0, 0, 0, 0.05); }
    .quick-panel.show { display: block; }
    .quick-panel-title { font-size: 13px; font-weight: 800; margin-bottom: 10px; }
    .quick-rate-row { display: flex; align-items: center; gap: 10px; }
    .rate-value { font-size: 22px; font-weight: 800; }
    .rate-note { color: #86868b; font-size: 11px; }
    /* Bottom navigation */
    .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000; padding: 7px max(8px, env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(0, 0, 0, 0.08); }
    .bottom-nav-inner { width: min(700px, 100%); margin: 0 auto; display: flex; justify-content: center; gap: 5px; }
    .nav-btn { flex: 1; max-width: 180px; border: 0; background: transparent; border-radius: 12px; min-height: 45px; color: #86868b; font-size: 11px; font-weight: 700; }
    .nav-btn.active { background: #f2f2f7; color: #007aff; }
    /* Loading */
    .loading { display: flex; align-items: center; justify-content: center; padding: 45px 20px; color: #86868b; font-size: 13px; }
    .loading-dot { width: 7px; height: 7px; border-radius: 50%; background: #007aff; margin-right: 8px; animation: loadingPulse 0.9s infinite alternate; }
    @keyframes loadingPulse { from { opacity: 0.3; } to { opacity: 1; } }
    /* Responsive */
    @media (max-width: 760px) { .app-main, .header-inner { width: min(100% - 22px, 1100px); } .trip-grid, .filter-grid { grid-template-columns: 1fr; } }
    @media (max-width: 520px) { .app-main { padding-top: 20px; } .page-title { font-size: 24px; } .brand-subtitle, .user-name { display: none; } .form-grid { grid-template-columns: 1fr; } .form-group.full { grid-column: auto; } .photo-thumb { width: 50px; height: 50px; flex-basis: 50px; } .modal-card { padding: 18px 15px; } }
  </style>
</head>
<body>

  <!-- Login -->
  <div id="login-overlay">
    <div class="login-card">
      <div class="login-logo">✈️</div>
      <h1>日本自由行</h1>
      <p>登入 Google 後即可同步旅程資料，<br>並使用 Google Drive 私人照片儲存功能。</p>
      <button id="google-login-btn"><span style="font-weight:800; color:#4285f4; margin-right:8px;">G</span>使用 Google 帳號登入</button>
      <div id="login-error"></div>
    </div>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon">🇯🇵</div>
        <div class="brand-text">
          <div class="brand-title">日本自由行</div>
          <div class="brand-subtitle">Trip Planner</div>
        </div>
      </div>
      <div class="user-area">
        <div id="user-name" class="user-name"></div>
        <button id="logout-btn" class="logout-btn" style="display:none;">登出</button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="app-main">
    <!-- Trips View -->
    <section id="trips-view" class="view active">
      <div class="page-title-row">
        <div>
          <h1 class="page-title">我的旅程</h1>
          <p class="page-subtitle">建立、管理你的日本旅行計畫</p>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-secondary" onclick="openJoinTrip()">🤝 加入旅程</button>
          <button class="btn btn-primary" onclick="openCreateTrip()">＋ 新增旅程</button>
        </div>
      </div>
      <div id="trips-list"><div class="loading"><span class="loading-dot"></span>載入旅程中…</div></div>
    </section>

    <!-- Trip Detail View -->
    <section id="trip-view" class="view">
      <div class="trip-detail-header">
        <div class="back-row">
          <button class="icon-btn" onclick="showTripsView()">←</button>
          <div style="min-width:0;">
            <h1 id="trip-detail-title" class="trip-detail-title">旅程</h1>
            <div id="trip-detail-date" class="trip-detail-date"></div>
          </div>
        </div>
      </div>

      <!-- Schedule Tab -->
      <div id="schedule-tab">
        <div class="toolbar">
          <button class="btn btn-primary btn-small" onclick="openAddSchedule()">＋ 新增行程</button>
          <button class="btn btn-secondary btn-small" onclick="toggleScheduleForm()">展開表單</button>
          <button class="btn btn-secondary btn-small" onclick="showSyncStatus()">☁ 同步中</button>
        </div>
        <div id="sch-form-body" class="form-card" style="display:none;">
          <div class="modal-header">
            <h2 class="modal-title">新增行程</h2>
            <button class="modal-close" onclick="toggleScheduleForm(false)">×</button>
          </div>
          <form id="schedule-form">
            <div class="form-grid">
              <div class="form-group"><label class="form-label">日期</label><input id="sch-date" class="form-input" type="date" required></div>
              <div class="form-group"><label class="form-label">Day</label><input id="sch-day" class="form-input" type="text" placeholder="Day 1"></div>
              <div class="form-group"><label class="form-label">開始時間</label><input id="sch-start" class="form-input" type="time" required></div>
              <div class="form-group"><label class="form-label">結束時間</label><input id="sch-end" class="form-input" type="time"></div>
              <div class="form-group full"><label class="form-label">地點 / 行程</label><input id="sch-place" class="form-input" type="text" placeholder="例如：大阪城、USJ、心齋橋" required></div>
              <div class="form-group"><label class="form-label">預估時間</label><input id="sch-duration" class="form-input" type="text" placeholder="例如：2 小時"></div>
              <div class="form-group"><label class="form-label">照片</label><input id="sch-photo" class="form-input" type="file" accept="image/*"><div id="sch-photo-preview" class="photo-preview"></div><div id="sch-photo-status" class="photo-status"></div></div>
            </div>
            <div class="form-actions">
              <button type="button" class="btn btn-secondary" onclick="toggleScheduleForm(false)">取消</button>
              <button type="submit" class="btn btn-primary">新增行程</button>
            </div>
          </form>
        </div>
        <div id="schedule-list"></div>
      </div>

      <!-- Buy Tab -->
      <div id="buy-tab" style="display:none;">
        <div class="toolbar">
          <button class="btn btn-primary btn-small" onclick="openAddBuy()">＋ 新增代購</button>
          <button class="btn btn-secondary btn-small" onclick="toggleRatePanel()">💴 匯率</button>
          <button class="btn btn-secondary btn-small" onclick="toggleFilterPanel()">🔎 篩選</button>
        </div>
        <div id="rate-panel" class="quick-panel">
          <div class="quick-panel-title">日圓匯率</div>
          <div class="quick-rate-row"><div id="exchange-rate" class="rate-value">—</div><div class="rate-note">JPY → TWD</div></div>
        </div>
        <div id="filter-panel" class="filter-panel">
          <div class="filter-grid">
            <div><label class="filter-label">分類</label><select id="buy-filter-category" class="form-select" onchange="renderBuyList()"><option value="">全部分類</option></select></div>
            <div><label class="filter-label">狀態</label><select id="buy-filter-status" class="form-select" onchange="renderBuyList()"><option value="">全部</option><option value="todo">未購買</option><option value="done">已購買</option></select></div>
            <div><label class="filter-label">代購人</label><select id="buy-filter-owner" class="form-select" onchange="renderBuyList()"><option value="">全部</option></select></div>
          </div>
        </div>
        <div id="buy-list"></div>
      </div>
    </section>
  </main>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <button id="nav-trips" class="nav-btn active" onclick="showTripsView()">🧳<br>我的旅程</button>
      <button id="nav-schedule" class="nav-btn" onclick="currentTripId ? switchTab('schedule') : showTripsView()">🗓<br>行程</button>
      <button id="nav-buy" class="nav-btn" onclick="currentTripId ? switchTab('buy') : showTripsView()">🛍<br>代購</button>
    </div>
  </nav>

  <!-- Create Trip Modal -->
  <div id="create-trip-modal" class="modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">新增旅程</h2>
        <button class="modal-close" onclick="closeModal('create-trip-modal')">×</button>
      </div>
      <form id="create-trip-form">
        <div class="form-grid">
          <div class="form-group full"><label class="form-label">旅程名稱</label><input id="trip-name" class="form-input" type="text" placeholder="例如：2026 大阪家庭旅行" required></div>
          <div class="form-group"><label class="form-label">開始日期</label><input id="trip-start" class="form-input" type="date" required></div>
          <div class="form-group"><label class="form-label">結束日期</label><input id="trip-end" class="form-input" type="date" required></div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal('create-trip-modal')">取消</button>
          <button type="submit" class="btn btn-primary">建立旅程</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Join Trip Modal -->
  <div id="join-trip-modal" class="modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">加入旅程</h2>
        <button class="modal-close" onclick="closeModal('join-trip-modal')">×</button>
      </div>
      <form id="join-trip-form">
        <div class="form-grid">
          <div class="form-group full"><label class="form-label">請輸入邀請碼</label><input id="join-trip-code" class="form-input" type="text" placeholder="例如：A1B2C3" required style="text-transform: uppercase;"></div>
        </div>
        <div class="form-actions">

  <!-- Lightbox Modal (Req 3) -->

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <script>
   const firebaseConfig = {
    apiKey: "AIzaSyDCNbwIV1iMoxwlPL7a4xEbMwpMv75sOak",
    authDomain: "japan-trip-701cd.firebaseapp.com",
    projectId: "japan-trip-701cd",
    storageBucket: "japan-trip-701cd.firebasestorage.app",
    messagingSenderId: "811979985418",
    appId: "1:811979985418:web:e3e93cf122f780af4585f3",
    measurementId: "G-62BVTK2QEZ"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  const TODAY_REFERENCE_RATE = 0.22;
  let trips = [];
  let currentTripId = null;
  let tripsUnsubscribe = null;
  let rateUnsubscribe = null;
  let googleDriveAccessToken = null;
  let exchangeRate = TODAY_REFERENCE_RATE;

  function escapeHtml(value) {
    if (value == null) return '';
    return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }
  function formatDate(dateString) {
    if (!dateString) return '';
    const date = new Date(dateString + 'T00:00:00');
    if (Number.isNaN(date.getTime())) return dateString;
    return date.toLocaleDateString('zh-TW', { year: 'numeric', month: 'numeric', day: 'numeric' });
  }
  function formatNumber(value) { return (Number(value) || 0).toLocaleString('zh-TW'); }
  function addMinutesToTime(timeString, minutes) {
    if (!timeString) return '';
    const parts = timeString.split(':');
    if (parts.length < 2) return '';
    let hours = parseInt(parts[0], 10), mins = parseInt(parts[1], 10);
    if (Number.isNaN(hours) || Number.isNaN(mins)) return '';
    let total = Math.min(hours * 60 + mins + minutes, 23 * 60 + 59);
    return String(Math.floor(total / 60)).padStart(2, '0') + ':' + String(total % 60).padStart(2, '0');
  }
  function getDayLabel(dateString) {
    if (!dateString) return '';
    const date = new Date(dateString + 'T00:00:00');
    if (Number.isNaN(date.getTime())) return '';
    return '週' + ['日','一','二','三','四','五','六'][date.getDay()];
  }
  function getCurrentTrip() { return trips.find(t => t.id === currentTripId); }

  auth.onAuthStateChanged(async user => {
    const loginOverlay = document.getElementById('login-overlay');
    const userName = document.getElementById('user-name');
    const logoutBtn = document.getElementById('logout-btn');
    if (user) {
      if (loginOverlay) loginOverlay.style.display = 'none';
      if (userName) userName.textContent = user.displayName || user.email || '';
      if (logoutBtn) logoutBtn.style.display = 'block';
      googleDriveAccessToken = null;
      startTripSync(user);
      startRateSync();
    } else {
      if (loginOverlay) loginOverlay.style.display = 'flex';
      if (userName) userName.textContent = '';
      if (logoutBtn) logoutBtn.style.display = 'none';
      googleDriveAccessToken = null;
      stopTripSync();
      stopRateSync();
      trips = [];
      currentTripId = null;
      localStorage.removeItem('currentTripId');
      renderTripsList();
      showTripsView();
    }
  });

  // 安全綁定按鈕，確保元素存在才監聽
  const googleLoginBtn = document.getElementById('google-login-btn');
  if (googleLoginBtn) {
    googleLoginBtn.addEventListener('click', async () => {
      const error = document.getElementById('login-error');
      if (error) error.textContent = ''; 
      googleLoginBtn.disabled = true; 
      googleLoginBtn.innerHTML = 'Google 登入中…';
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.addScope('https://www.googleapis.com/auth/drive.file');
        const result = await auth.signInWithPopup(provider);
        // 還原為相容性最高的寫法
        googleDriveAccessToken = (result && result.credential) ? (result.credential.accessToken || null) : null;
      } catch (err) {
        if (error) error.textContent = '登入失敗：' + (err.message || err.code || err);
      } finally {
        googleLoginBtn.disabled = false;
        googleLoginBtn.innerHTML = '<span style="font-weight:800; color:#4285f4; margin-right:8px;">G</span> 使用 Google 帳號登入';
      }
    });
  }

  const logoutBtn = document.getElementById('logout-btn');
  if (logoutBtn) logoutBtn.addEventListener('click', async () => { try { await auth.signOut(); } catch (err) { console.error(err); } });

  function stopTripSync() { if (tripsUnsubscribe) tripsUnsubscribe(); tripsUnsubscribe = null; }
  function startTripSync(user) {
    stopTripSync();
    if (!user) { trips = []; renderTripsList(); return; }
    const savedTripId = localStorage.getItem('currentTripId');
    tripsUnsubscribe = db.collection('trips').where('memberUids', 'array-contains', user.uid).onSnapshot(snapshot => {
      trips = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderTripsList();
      if (currentTripId && !trips.some(t => t.id === currentTripId)) {
        currentTripId = null; localStorage.removeItem('currentTripId'); showTripsView(); return;
      }
      if (!currentTripId && savedTripId && trips.some(t => t.id === savedTripId)) openTripDetail(savedTripId);
    }, err => console.error('Trip Sync Error:', err));
  }

  function stopRateSync() { if (rateUnsubscribe) rateUnsubscribe(); rateUnsubscribe = null; }
  function startRateSync() {
    stopRateSync();
    rateUnsubscribe = db.collection('settings').doc('rate').onSnapshot(doc => {
      if (doc.exists) {
        const rate = Number(doc.data().rate || doc.data().jpyToTwd || doc.data().value);
        if (Number.isFinite(rate) && rate > 0) exchangeRate = rate;
      }
      const el = document.getElementById('exchange-rate');
      if (el) el.textContent = exchangeRate.toFixed(4);
    }, err => console.warn('Rate sync error:', err));
  }

  function showTripsView() {
    currentTripId = null; localStorage.removeItem('currentTripId');
    document.getElementById('trips-view').classList.add('active');
    document.getElementById('trip-view').classList.remove('active');
    document.getElementById('nav-trips').classList.add('active');
    document.getElementById('nav-schedule').classList.remove('active');
    document.getElementById('nav-buy').classList.remove('active');
    closeAllQuickPanels();
  }

  function openTripDetail(id) {
    const trip = trips.find(t => t.id === id);
    if (!trip) return;
    currentTripId = id; localStorage.setItem('currentTripId', id);
    document.getElementById('trips-view').classList.remove('active');
    document.getElementById('trip-view').classList.add('active');
    document.getElementById('trip-detail-title').textContent = trip.name || '未命名旅程';
    document.getElementById('trip-detail-date').textContent = `${formatDate(trip.startDate)} ～ ${formatDate(trip.endDate)}`;
    switchTab('schedule');
    setTimeout(() => setScheduleDefaults(), 0);
  }

  function renderTripsList() {
    const list = document.getElementById('trips-list');
    if (!list) return;
    if (!trips.length) {
      list.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🗾</div><div style="font-weight:800; color:#1d1d1f; margin-bottom:6px;">還沒有旅程</div><div style="margin-bottom:18px;">建立你的第一個日本旅行吧！</div><button class="btn btn-primary" onclick="openCreateTrip()">＋ 建立旅程</button></div>`;
      return;
    }
    list.innerHTML = `<div class="trip-grid">${trips.map(trip => `
      <div class="trip-card" onclick="openTripDetail('${escapeHtml(trip.id)}')">
        <div class="trip-card-header"><div style="min-width:0;"><div class="trip-name">${escapeHtml(trip.name || '未命名')}</div><div class="trip-date">${escapeHtml(formatDate(trip.startDate))} ～${escapeHtml(formatDate(trip.endDate))}</div></div><div style="font-size:22px;">🇯🇵</div></div>
        <div class="trip-owner">建立者：${escapeHtml(trip.ownerName || '未知')}</div>
        ${(trip.inviteCode || trip.code) ? `<div class="trip-code">邀請碼：${escapeHtml(trip.inviteCode || trip.code)}</div>` : ''}
      </div>`).join('')}</div>`;
  }

  function openCreateTrip() {
    document.getElementById('create-trip-form').reset();
    const today = new Date().toISOString().slice(0, 10);
    document.getElementById('trip-start').value = today;
    document.getElementById('trip-end').value = today;
    document.getElementById('create-trip-modal').classList.add('show');
  }

  const createTripForm = document.getElementById('create-trip-form');
  if (createTripForm) {
    createTripForm.addEventListener('submit', async event => {
      event.preventDefault();
      const user = auth.currentUser;
      if (!user) return alert('請先登入');
      const name = document.getElementById('trip-name').value.trim();
      const startDate = document.getElementById('trip-start').value;
      const endDate = document.getElementById('trip-end').value;
      if (!name) return alert('請輸入旅程名稱');
      if (startDate && endDate && startDate > endDate) return alert('結束日期不能早於開始日期');
      const inviteCode = Math.random().toString(36).slice(2, 8).toUpperCase();
      try {
        const tripRef = await db.collection('trips').add({
          name, startDate, endDate, inviteCode, code: inviteCode, schedules: [], buyItems: [],
          ownerUid: user.uid, ownerName: user.displayName || user.email || '', memberUids: [user.uid],
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        closeModal('create-trip-modal');
        currentTripId = tripRef.id; localStorage.setItem('currentTripId', tripRef.id);
        if (!trips.some(t => t.id === tripRef.id)) trips.push({ id: tripRef.id, name, startDate, endDate, inviteCode, code: inviteCode, schedules: [], buyItems: [], ownerUid: user.uid, ownerName: user.displayName || user.email || '', memberUids: [user.uid] });
        openTripDetail(tripRef.id);
      } catch (err) { alert('建立失敗：\n' + err.message); }
    });
  }

  function openJoinTrip() {
    document.getElementById('join-trip-form').reset();
    document.getElementById('join-trip-modal').classList.add('show');
    setTimeout(() => document.getElementById('join-trip-code').focus(), 50);
  }

  const joinTripForm = document.getElementById('join-trip-form');
  if (joinTripForm) {
    joinTripForm.addEventListener('submit', async event => {
      event.preventDefault();
      const user = auth.currentUser;
      if (!user) return alert('請先登入 Google 帳號');
      const code = document.getElementById('join-trip-code').value.trim().toUpperCase();
      if (!code) return;
      
      const submitBtn = event.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true; submitBtn.textContent = '尋找並加入中…';
      try {
        const snapshot = await db.collection('trips').where('inviteCode', '==', code).get();
        if (snapshot.empty) {
          alert('找不到此邀請碼對應的旅程！請確認邀請碼是否正確。');
          submitBtn.disabled = false; submitBtn.textContent = '確認加入'; return;
        }
        const tripDoc = snapshot.docs[0];
        const tripData = tripDoc.data();
        if (tripData.memberUids && tripData.memberUids.includes(user.uid)) {
          alert('你已經在這個旅程中了！'); closeModal('join-trip-modal'); return;
        }
        await db.collection('trips').doc(tripDoc.id).update({ memberUids: firebase.firestore.FieldValue.arrayUnion(user.uid) });
        alert(`成功加入「${tripData.name}」！`);
        closeModal('join-trip-modal');
      } catch (err) {
        alert('加入旅程失敗：\n' + (err.message || err));
      } finally {
        submitBtn.disabled = false; submitBtn.textContent = '確認加入';
      }
    });
  }

  function switchTab(tab) {
    document.getElementById('schedule-tab').style.display = tab === 'schedule' ? 'block' : 'none';
    document.getElementById('buy-tab').style.display = tab === 'buy' ? 'block' : 'none';
    document.getElementById('nav-schedule').classList.toggle('active', tab === 'schedule');
    document.getElementById('nav-buy').classList.toggle('active', tab === 'buy');
    document.getElementById('nav-trips').classList.remove('active');
    closeAllQuickPanels();
    if (tab === 'buy') renderBuyList();
  }

  function openAddSchedule() {
    closeAllQuickPanels(); document.getElementById('schedule-form').reset();
    clearPhotoSelection('sch-photo', 'sch-photo-preview');
    const trip = getCurrentTrip(); if (!trip) return;
    const schedules = Array.isArray(trip.schedules) ? [...trip.schedules] : [];
    if (schedules.length) {
      schedules.sort((a, b) => `${a.date||''} ${a.startTime||''}`.localeCompare(`${b.date||''} ${b.startTime||''}`));
      const last = schedules[schedules.length - 1];
      document.getElementById('sch-date').value = last.date || trip.startDate || '';
      document.getElementById('sch-day').value = last.day || getDayLabel(last.date);
      document.getElementById('sch-start').value = last.endTime || last.startTime || '09:00';
      document.getElementById('sch-end').value = addMinutesToTime(document.getElementById('sch-start').value, 60);
    } else setScheduleDefaults();
    toggleScheduleForm(true); setTimeout(() => document.getElementById('sch-place').focus(), 50);
  }

  function toggleScheduleForm(force) {
    const body = document.getElementById('sch-form-body');
    body.style.display = (typeof force === 'boolean' ? force : body.style.display === 'none') ? 'block' : 'none';
  }

  function setScheduleDefaults() {
    const trip = getCurrentTrip(); if (!trip) return;
    const dateEl = document.getElementById('sch-date'), dayEl = document.getElementById('sch-day'), startEl = document.getElementById('sch-start'), endEl = document.getElementById('sch-end');
    if (!dateEl.value) dateEl.value = trip.startDate || new Date().toISOString().slice(0, 10);
    dayEl.value = dayEl.value || getDayLabel(dateEl.value);
    if (!startEl.value) {
      const sch = Array.isArray(trip.schedules) ? trip.schedules : [];
      if (sch.length > 0) {
        const sortedSch = [...sch].sort((a,b)=>`${a.date||''} ${a.startTime||''}`.localeCompare(`${b.date||''} ${b.startTime||''}`));
        startEl.value = sortedSch[sortedSch.length - 1].endTime || '09:00';
      } else {
        startEl.value = '09:00';
      }
    }
    if (!endEl.value) endEl.value = addMinutesToTime(startEl.value, 60);
  }

  const schDateInput = document.getElementById('sch-date');
  if (schDateInput) {
    schDateInput.addEventListener('change', e => document.getElementById('sch-day').value = getDayLabel(e.target.value));
  }

  const scheduleForm = document.getElementById('schedule-form');
  if (scheduleForm) {
    scheduleForm.addEventListener('submit', async event => {
      event.preventDefault(); const user = auth.currentUser, trip = getCurrentTrip(); if (!user || !trip) return alert('請先登入並選擇旅程');
      const submitBtn = event.target.querySelector('button[type="submit"]'); submitBtn.disabled = true; submitBtn.textContent = '儲存中…';
      try {
        const photoFile = document.getElementById('sch-photo').files[0];
        let photoFileId = null, photoUrl = null;
        if (photoFile) {
          setPhotoStatus('sch-photo', '照片上傳 Google Drive 中…');
          const uploaded = await uploadPhoto(photoFile, 'schedule');
          photoFileId = uploaded.fileId || null; photoUrl = uploaded.photoUrl || null;
        }
        const newItem = { id: Date.now(), date: document.getElementById('sch-date').value, day: document.getElementById('sch-day').value.trim(), startTime: document.getElementById('sch-start').value, endTime: document.getElementById('sch-end').value, place: document.getElementById('sch-place').value.trim(), duration: document.getElementById('sch-duration').value.trim(), photoFileId, photoUrl, createdBy: user.uid, createdAt: Date.now() };
        const schedules = Array.isArray(trip.schedules) ? [...trip.schedules] : []; schedules.push(newItem);
        await db.collection('trips').doc(trip.id).update({ schedules });
        event.target.reset(); clearPhotoSelection('sch-photo', 'sch-photo-preview'); toggleScheduleForm(false);
      } catch (err) { alert('新增失敗：\n' + err.message); } finally { submitBtn.disabled = false; submitBtn.textContent = '新增行程'; }
    });
  }

  function renderSchedules() {
    const list = document.getElementById('schedule-list'), trip = getCurrentTrip(); if (!list || !trip) return;
    const schedules = Array.isArray(trip.schedules) ? [...trip.schedules] : [];
    if (!schedules.length) { list.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🗓</div><div style="font-weight:800; color:#1d1d1f; margin-bottom:6px;">還沒有行程</div><div style="margin-bottom:18px;">從第一個景點開始規劃吧！</div><button class="btn btn-primary" onclick="openAddSchedule()">＋ 新增行程</button></div>`; return; }
    schedules.sort((a, b) => `${a.date||''} ${a.startTime||''}`.localeCompare(`${b.date||''} ${b.startTime||''}`));
    const groups = schedules.reduce((acc, item) => { const k = item.date || '未指定日期'; acc[k] = acc[k] || []; acc[k].push(item); return acc; }, {});
    list.innerHTML = Object.keys(groups).sort().map(date => {
      const items = groups[date];
      return `<div class="schedule-day" data-day="${escapeHtml(date)}"><div class="day-header"><div class="day-badge">${escapeHtml(items[0].day || getDayLabel(date))}</div><div class="day-date">${escapeHtml(formatDate(date))}</div><button class="day-toggle" onclick="toggleDayGroup('${escapeHtml(date)}')">收合</button></div><div class="schedule-list" id="day-group-${escapeHtml(date)}">${items.map(item => `
        <div class="swipe-container schedule-swipe">
          <div class="swipe-content schedule-card">
            <div class="schedule-time">${escapeHtml(item.endTime ? `${item.startTime||'--:--'} ～ ${item.endTime}` : item.startTime||'--:--')}</div>
            <div style="min-width:0;">

  async function hydrateDrivePhotos(listEl) {
    const nodes = Array.from(listEl.querySelectorAll('[data-drive-photo-id]')); if (!nodes.length) return;
    try {
      await ensureGoogleDriveToken();
      await Promise.all(nodes.map(async node => {
        const fileId = node.dataset.drivePhotoId; if (!fileId) return;
        try {
          const url = await getDrivePhotoUrl(fileId); if (!url || !node.isConnected) return;
          const img = document.createElement('img'); img.className = 'photo-thumb'; img.src = url; 
          img.style.cursor = 'pointer';
          img.onclick = (e) => { e.stopPropagation(); openLightbox(url); }; 
          img.onerror = () => { if (img.isConnected) img.remove(); };
          node.replaceWith(img);
        } catch (e) { if(node.isConnected) node.remove(); }
      }));
    } catch (err) { nodes.forEach(n => { if(n.isConnected) n.remove(); }); }
  }

  function buildPreviewWithClear(imgElement, inputId, previewId) {
    const wrapper = document.createElement('div');
    wrapper.style.position = 'relative'; wrapper.style.display = 'inline-block'; wrapper.style.marginTop = '10px';
    
    const clearBtn = document.createElement('button');
    clearBtn.innerHTML = '✕'; clearBtn.style.position = 'absolute'; clearBtn.style.top = '-10px'; clearBtn.style.right = '-10px';
    clearBtn.style.background = '#ff3b30'; clearBtn.style.color = '#fff'; clearBtn.style.border = 'none'; clearBtn.style.borderRadius = '50%';
    clearBtn.style.width = '24px'; clearBtn.style.height = '24px'; clearBtn.style.fontSize = '12px'; clearBtn.style.fontWeight = 'bold';
    clearBtn.style.cursor = 'pointer'; clearBtn.style.boxShadow = '0 2px 5px rgba(0,0,0,0.3)';
    clearBtn.style.display = 'flex'; clearBtn.style.alignItems = 'center'; clearBtn.style.justifyContent = 'center';
    clearBtn.onclick = (e) => { e.preventDefault(); clearPhotoSelection(inputId, previewId); };

    wrapper.appendChild(imgElement); wrapper.appendChild(clearBtn);
    return wrapper;
  }

  async function showPhotoPreview(inputId, previewId, existingUrl = '', fileId = '') {
    const input = document.getElementById(inputId), preview = document.getElementById(previewId); if (!input || !preview) return;
    preview.innerHTML = '';
    const removeFlag = document.getElementById(inputId + '-remove'); if (removeFlag) removeFlag.value = 'false';

    if (fileId) {
      preview.innerHTML = '<div style="color:#86868b; font-size:11px;">Google Drive 照片載入中…</div>';
      try {
        const driveUrl = await getDrivePhotoUrl(fileId); preview.innerHTML = '';
        if (driveUrl) { const img = document.createElement('img'); img.src = driveUrl; preview.appendChild(buildPreviewWithClear(img, inputId, previewId)); } 
        else preview.innerHTML = `<div style="color:#ff3b30; font-size:11px;">照片無法讀取</div>`;
      } catch(e) { preview.innerHTML = `<div style="color:#ff3b30; font-size:11px;">讀取失敗</div>`; }
    } else if (existingUrl) {
       const img = document.createElement('img'); img.src = existingUrl; preview.appendChild(buildPreviewWithClear(img, inputId, previewId));
    }

    input.onchange = () => {
      const file = input.files[0]; if (!file) return;
      const localUrl = URL.createObjectURL(file); const img = document.createElement('img'); img.src = localUrl;
      img.onload = () => URL.revokeObjectURL(localUrl);
      preview.innerHTML = ''; preview.appendChild(buildPreviewWithClear(img, inputId, previewId));
      setPhotoStatus(inputId, '已選擇照片'); if (removeFlag) removeFlag.value = 'false';
    };
  }

  function setPhotoStatus(id, text) { const s = document.getElementById(id+'-status'); if (s) s.textContent = text; }

  async function ensureGoogleDriveToken() {
    if (googleDriveAccessToken) return googleDriveAccessToken;
    if (!auth.currentUser) throw new Error('請先登入 Google 帳號');
    const provider = new firebase.auth.GoogleAuthProvider(); provider.addScope('https://www.googleapis.com/auth/drive.file');
    const result = await auth.currentUser.reauthenticateWithPopup(provider);
    googleDriveAccessToken = (result && result.credential) ? (result.credential.accessToken || null) : null;
    if (!googleDriveAccessToken) throw new Error('無 Google Drive 授權');
    return googleDriveAccessToken;
  }

  async function getOrCreateDriveFolder(folderName) {
    const query = `name = '${folderName.replace(/'/g,"\\'")}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false`;
    const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&spaces=drive&fields=files(id,name)`;
    const token = await ensureGoogleDriveToken(), res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } }), data = await res.json();
    if (data.files && data.files.length) return data.files[0].id;
    const cRes = await fetch('https://www.googleapis.com/drive/v3/files', { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ name: folderName, mimeType: 'application/vnd.google-apps.folder' }) });
    return (await cRes.json()).id;
  }

  async function uploadPhoto(file, type = 'other') {
    if (!file) throw new Error('無檔案');
    const token = await ensureGoogleDriveToken(), folderId = await getOrCreateDriveFolder('行程照片');
    const boundary = '-------314159265358979323846', delimiter = `\r\n--${boundary}\r\n`, closeDelimiter = `\r\n--${boundary}--`;
    const fileBuffer = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsArrayBuffer(file); });
    const body = new Blob([
      `${delimiter}Content-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name: `${Date.now()}_${file.name}`, parents: [folderId], mimeType: file.type || 'application/octet-stream' })}`,
      `${delimiter}Content-Type: ${file.type || 'application/octet-stream'}\r\n\r\n`, fileBuffer, closeDelimiter
    ], { type: `multipart/related; boundary="${boundary}"` });
    
    const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink', { method: 'POST', headers: { Authorization: `Bearer ${token}` }, body });
    if (response.status === 401) { googleDriveAccessToken = null; throw new Error('授權失效'); }
    if (!response.ok) throw new Error(`上傳失敗 HTTP ${response.status}`);
    const uploaded = await response.json();
    return { fileId: uploaded.id, photoUrl: null, webViewLink: uploaded.webViewLink || null };
  }

  async function getDrivePhotoUrl(fileId) {
    if (!fileId) return null;
    try {
      let token = await ensureGoogleDriveToken();
      const url = `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}?alt=media`;
      let res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
      if (res.status === 401) { googleDriveAccessToken = null; token = await ensureGoogleDriveToken(); res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } }); }
      if (!res.ok) throw new Error('讀取失敗');
      return URL.createObjectURL(await res.blob());
    } catch (err) { return null; }
  }
