<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>日本自由行助手 (雲端同步版)</title>
  <style>
    :root {
      --primary-color: #007aff;
      --primary-light: #eef6ff;
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --text-color: #1c1c1e;
      --sub-text: #8e8e93;
      --border-color: #e5e5ea;
      --danger-color: #ff3b30;
      --success-color: #34c759;
      --warning-color: #ff9500;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 90px;
      font-size: 16px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      background: rgba(249, 249, 249, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      font-size: 1.1rem;
      z-index: 100;
    }

    .header-btn {
      background: none;
      border: none;
      color: var(--primary-color);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
    }

    .container {
      padding: 15px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Views & Tabs Switcher */
    .view, .tab-content {
      display: none;
    }
    .view.active, .tab-content.active {
      display: block;
    }

    /* Card Style */
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid rgba(0,0,0,0.03);
    }

    /* Form Controls */
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--sub-text);
      margin-bottom: 6px;
      font-weight: 500;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      background-color: #fff;
      appearance: none;
      -webkit-appearance: none;
    }
    .form-row {
      display: flex;
      gap: 10px;
    }
    .form-row .form-group {
      flex: 1;
    }

    /* 折疊表單設計 */
    .collapsible-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      font-weight: 600;
      color: var(--primary-color);
    }
    .collapsible-body {
      display: none;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px dashed var(--border-color);
    }
    .collapsible-body.show {
      display: block;
    }

    /* Buttons */
    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      text-align: center;
    }
    .btn-sm {
      padding: 5px 10px;
      font-size: 0.8rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-edit {
      background-color: #e5e5ea;
      color: #1c1c1e;
    }
    .btn-danger {
      background-color: rgba(255, 59, 48, 0.1);
      color: var(--danger-color);
    }
    .btn-action-group {
      display: flex;
      gap: 6px;
    }

    /* Bottom Navigation Bar */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(249, 249, 249, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
      z-index: 1000;
    }
    .nav-item {
      flex: 1;
      text-align: center;
      color: var(--sub-text);
      font-size: 0.75rem;
      text-decoration: none;
      border: none;
      background: none;
      cursor: pointer;
    }
    .nav-item.active {
      color: var(--primary-color);
      font-weight: 600;
    }
    .nav-icon {
      font-size: 1.4rem;
      display: block;
      margin-bottom: 2px;
    }

    /* 行程美化卡片 */
    .sch-card {
      position: relative;
      border-left: 4px solid var(--primary-color);
      padding-left: 14px;
    }
    .sch-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .day-badge {
      background: var(--primary-color);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .date-text {
      font-size: 0.85rem;
      color: var(--sub-text);
      margin-left: 6px;
      font-weight: 500;
    }
    .sch-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-color);
      margin-bottom: 6px;
    }
    .sch-time {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.85rem;
      color: var(--primary-color);
      background: var(--primary-light);
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .sch-note {
      font-size: 0.85rem;
      color: #636366;
      margin-top: 6px;
      background: #f8f8fa;
      padding: 6px 10px;
      border-radius: 6px;
    }

    /* Proxy Buy Specifics */
    .buy-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .buy-item.bought .sch-title {
      text-decoration: line-through;
      color: var(--sub-text);
    }
    .checkbox-custom {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .checkbox-custom.checked {
      background-color: var(--success-color);
      border-color: var(--success-color);
      color: white;
    }
    .checkbox-custom.checked::after {
      content: '✓';
      font-size: 14px;
      font-weight: bold;
    }

    .rate-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--primary-light);
      padding: 10px 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .rate-bar input {
      width: 80px;
      padding: 4px 8px;
      text-align: right;
    }

    .trip-card {
      cursor: pointer;
      border-left: 5px solid var(--primary-color);
    }

    .sync-status {
      font-size: 0.75rem;
      color: var(--success-color);
      text-align: center;
      margin-bottom: 10px;
    }

    /* Modal 彈窗樣式 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 20px;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal-card {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--sub-text);
      cursor: pointer;
    }

    /* === 2026 UI 更新：置頂快速工具列 === */
    .quick-toolbar {
      position: sticky;
      top: 61px;
      z-index: 90;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      margin: -15px -15px 12px;
      background: rgba(249,249,249,.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .quick-toolbar::-webkit-scrollbar { display:none; }
    .quick-btn {
      flex: 0 0 auto;
      border: 1px solid var(--border-color);
      background: #fff;
      color: var(--text-color);
      border-radius: 9px;
      padding: 7px 10px;
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .quick-btn.primary { color: var(--primary-color); }
    .quick-btn.sync { color: var(--success-color); }
    .quick-btn.active { background: var(--primary-light); border-color: #b8d8ff; }
    .quick-panel {
      display:none;
      background:#fff;
      border:1px solid var(--border-color);
      border-radius:12px;
      padding:12px;
      margin-bottom:12px;
      box-shadow:0 4px 14px rgba(0,0,0,.06);
    }
    .quick-panel.show { display:block; }
    .quick-panel-title {
      font-size:.82rem; font-weight:700; color:var(--text-color);
      margin-bottom:8px;
    }
    .rate-reference {
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      background:var(--primary-light); border-radius:9px; padding:9px 10px;
      font-size:.82rem; margin-bottom:8px;
    }
    .rate-reference b { color:var(--primary-color); }
    .rate-edit-row { display:flex; align-items:center; gap:8px; }
    .rate-edit-row input { flex:1; width:auto; padding:8px 10px; }
    .mini-note { font-size:.72rem; color:var(--sub-text); margin-top:5px; }

    /* === 行程：專案管理 / 日期群組 / 時間軸 === */
    .schedule-day {
      background:#fff; border:1px solid var(--border-color); border-radius:14px;
      margin-bottom:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.035);
    }
    .schedule-day-header {
      display:flex; align-items:center; gap:10px; padding:12px 13px; cursor:pointer;
      background:linear-gradient(180deg,#fff,#fafafa);
    }
    .schedule-day-arrow { color:var(--primary-color); font-weight:800; width:16px; }
    .schedule-day-main { flex:1; min-width:0; }
    .schedule-day-title { font-size:.98rem; font-weight:750; }
    .schedule-day-sub { font-size:.74rem; color:var(--sub-text); margin-top:2px; }
    .schedule-progress { width:64px; height:6px; background:#e9e9ee; border-radius:99px; overflow:hidden; }
    .schedule-progress span { display:block; height:100%; background:var(--primary-color); border-radius:99px; }
    .schedule-items { display:none; padding:0 12px 10px 20px; border-top:1px solid var(--border-color); }
    .schedule-items.show { display:block; }
    .timeline-item {
      display:grid; grid-template-columns:72px 14px 1fr auto; gap:8px; align-items:stretch;
      padding:10px 0; border-bottom:1px solid #f0f0f3;
    }
    .timeline-item:last-child { border-bottom:none; }
    .timeline-time { font-size:.76rem; font-weight:750; color:var(--primary-color); padding-top:2px; }
    .timeline-line { position:relative; width:14px; }
    .timeline-line::before { content:''; position:absolute; left:6px; top:5px; bottom:-12px; width:2px; background:#dbeafe; }
    .timeline-item:last-child .timeline-line::before { bottom:5px; }
    .timeline-line::after { content:''; position:absolute; left:3px; top:4px; width:8px; height:8px; border-radius:50%; background:var(--primary-color); }
    .timeline-content { min-width:0; }
    .timeline-title { font-size:.93rem; font-weight:700; line-height:1.3; }
    .timeline-note { font-size:.74rem; color:#636366; margin-top:3px; }
    .timeline-actions { display:flex; gap:4px; align-items:flex-start; }
    .timeline-actions .btn-sm { padding:4px 7px; }

    /* === 代購：委託人群組 === */
    .owner-group {
      background:#fff; border:1px solid var(--border-color); border-radius:14px;
      margin-bottom:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.035);
    }
    .owner-header {
      display:flex; align-items:center; justify-content:space-between; gap:8px;
      padding:11px 13px; cursor:pointer; background:#fafafa;
    }
    .owner-title { font-weight:750; font-size:.95rem; }
    .owner-meta { font-size:.72rem; color:var(--sub-text); }
    .owner-items { display:none; }
    .owner-items.show { display:block; }
    .buy-row {
      display:grid; grid-template-columns:28px 1fr auto; gap:8px; align-items:center;
      padding:9px 11px; border-top:1px solid #f0f0f3;
    }
    .buy-main { min-width:0; }
    .buy-line {
      display:flex; align-items:center; gap:7px; min-width:0; white-space:nowrap; overflow:hidden;
    }
    .buy-name { font-weight:650; overflow:hidden; text-overflow:ellipsis; }
    .buy-detail { font-size:.72rem; color:var(--sub-text); margin-top:2px; white-space:nowrap; }
    .buy-total { font-size:.82rem; font-weight:750; color:#d32f2f; white-space:nowrap; }
    .buy-actions { display:flex; gap:4px; }
    .tag { display:inline-block; padding:2px 6px; border-radius:5px; background:#f0f0f5; color:#636366; font-size:.65rem; }
    .sync-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--success-color); margin-right:4px; }

    @media (max-width:480px) {
      .timeline-item { grid-template-columns:64px 14px 1fr; }
      .timeline-actions { grid-column:3; margin-top:3px; }
      .buy-row { grid-template-columns:28px 1fr; }
      .buy-total, .buy-actions { grid-column:2; }
      .buy-actions { justify-content:flex-end; }
    }

  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <button id="back-to-trips-btn" class="header-btn" style="visibility: hidden;" onclick="showTripsView()">
      ‹ 返回旅程
    </button>
    <span id="header-title">日本自由行</span>
    <span style="width: 70px;"></span>
  </header>

  <div class="container">
    <div id="sync-notice" class="sync-status">🟢 雲端連線同步中</div>

    <!-- 第一頁：旅程選擇頁 (首頁) -->
    <div id="view-trips" class="view active">
      <div class="card">
        <div class="collapsible-header" onclick="toggleCollapsible('trip-form-body', 'trip-form-icon')">
          <span>➕ 新增自由行程</span>
          <span id="trip-form-icon">＋</span>
        </div>
        <div id="trip-form-body" class="collapsible-body">
          <form id="trip-form">
            <div class="form-group">
              <label>旅程名稱</label>
              <input type="text" id="trip-name" placeholder="例如：東京 6 天 5 夜自由行" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>開始日期</label>
                <input type="date" id="trip-start-date" required>
              </div>
              <div class="form-group">
                <label>結束日期</label>
                <input type="date" id="trip-end-date" required>
              </div>
            </div>
            <button type="submit" class="btn">建立旅程</button>
          </form>
        </div>
      </div>

      <h3 style="margin: 15px 5px 10px; font-size: 0.9rem; color: var(--sub-text);">我的旅程清單</h3>
      <div id="trips-list"></div>
    </div>

    <!-- 第二頁：行程與代購細項 -->
    <div id="view-detail" class="view">
      <!-- 置頂快速工具列：平時只佔一排，按下才展開 -->
      <div id="quick-toolbar" class="quick-toolbar">
        <button class="quick-btn sync" type="button"><span class="sync-dot"></span>同步中</button>
        <button class="quick-btn primary" type="button" onclick="toggleQuickPanel('add-panel')">＋ 新增</button>
        <button id="quick-rate-btn" class="quick-btn" type="button" onclick="toggleQuickPanel('rate-panel')">💴 匯率</button>
        <button id="quick-filter-btn" class="quick-btn" type="button" onclick="toggleQuickPanel('filter-panel')">☷ 篩選</button>
      </div>

      <div id="add-panel" class="quick-panel">
        <div class="quick-panel-title">新增</div>
        <div id="add-schedule-shortcut">
          <button class="btn" type="button" onclick="openAddSchedule()">＋ 新增行程細項</button>
        </div>
        <div id="add-buy-shortcut" style="display:none;">
          <button class="btn" type="button" onclick="openAddBuy()">＋ 新增代購商品</button>
        </div>
      </div>

      <div id="rate-panel" class="quick-panel">
        <div class="quick-panel-title">💴 日幣換算台幣</div>
        <div class="rate-reference">
          <span>今日參考匯率 <b id="rate-reference-date">2026-09-16</b></span>
          <b id="rate-reference-value">0.2057</b>
        </div>
        <div class="rate-edit-row">
          <span style="font-size:.82rem;white-space:nowrap;">使用匯率</span>
          <input type="number" id="exchange-rate" step="0.0001" value="0.2057" onchange="updateRate()" aria-label="使用匯率">
        </div>
        <div class="mini-note">參考值保留日期；使用匯率可自行修改，代購金額會依此計算。</div>
      </div>

      <div id="filter-panel" class="quick-panel">
        <div class="quick-panel-title">☷ 條件篩選</div>
        <div class="form-row">
          <div class="form-group">
            <label>分類</label>
            <select id="filter-category" onchange="renderBuyList()">
              <option value="ALL">全部分類</option>
              <option value="藥妝">藥妝</option>
              <option value="零食">零食</option>
              <option value="動漫/玩具">動漫/玩具</option>
              <option value="電器">電器</option>
              <option value="服飾">服飾</option>
              <option value="其他">其他</option>
            </select>
          </div>
          <div class="form-group">
            <label>購買狀態</label>
            <select id="filter-status" onchange="renderBuyList()">
              <option value="ALL">全部狀態</option>
              <option value="UNBOUGHT">未購買</option>
              <option value="BOUGHT">已購買</option>
            </select>
          </div>
          <div class="form-group">
            <label>委託人</label>
            <select id="filter-owner" onchange="renderBuyList()">
              <option value="ALL">全部委託人</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 1. 行程細項 Tab -->
      <div id="tab-schedule" class="tab-content">
        <div id="sch-form-body" class="quick-panel">
          <div class="quick-panel-title">＋ 新增行程細項</div>
          <form id="schedule-form">
            <div class="form-row">
              <div class="form-group">
                <label>日期</label>
                <input type="date" id="sch-date" required>
              </div>
              <div class="form-group">
                <label>天數 (如: Day 1)</label>
                <input type="text" id="sch-day" placeholder="Day 1" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>開始時間</label>
                <input type="time" id="sch-start" required>
              </div>
              <div class="form-group">
                <label>結束時間</label>
                <input type="time" id="sch-end" required>
              </div>
            </div>
            <div class="form-group">
              <label>地點 / 景點 / 行程內容</label>
              <input type="text" id="sch-place" placeholder="例如：成田機場 ✈️ 福岡機場" required>
            </div>
            <div class="form-group">
              <label>備註 / 停留時間</label>
              <input type="text" id="sch-duration" placeholder="例如：記得出示 Visit Japan Web QR Code">
            </div>
            <button type="submit" class="btn">新增行程</button>
          </form>
        </div>
        <div id="schedule-list"></div>
      </div>

      <!-- 2. 代購 Tab -->
      <div id="tab-buy" class="tab-content">
        <div id="buy-form-body" class="quick-panel">
          <div class="quick-panel-title">＋ 新增代購商品</div>
          <form id="buy-form">
            <div class="form-group">
              <label>商品名稱</label>
              <input type="text" id="buy-name" placeholder="例如：合利他命 EX" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>分類</label>
                <select id="buy-category">
                  <option value="藥妝">藥妝</option>
                  <option value="零食">零食</option>
                  <option value="動漫/玩具">動漫/玩具</option>
                  <option value="電器">電器</option>
                  <option value="服飾">服飾</option>
                  <option value="其他">其他</option>
                </select>
              </div>
              <div class="form-group">
                <label>數量</label>
                <input type="number" id="buy-qty" value="1" min="1" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>日幣單價 (円)</label>
                <input type="number" id="buy-price" placeholder="5000" required>
              </div>
              <div class="form-group">
                <label>委託人</label>
                <input type="text" id="buy-owner" placeholder="例如：小明" required>
              </div>
            </div>
            <button type="submit" class="btn">新增代購項</button>
          </form>
        </div>
        <div id="buy-list"></div>
      </div>
    </div>

  </div>

  <!-- 編輯行程 Modal -->
  <div id="edit-sch-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <span>✏️ 編輯行程細項</span>
        <button class="modal-close" onclick="closeModal('edit-sch-modal')">✕</button>
      </div>
      <form id="edit-sch-form">
        <input type="hidden" id="edit-sch-id">
        <div class="form-row">
          <div class="form-group">
            <label>日期</label>
            <input type="date" id="edit-sch-date" required>
          </div>
          <div class="form-group">
            <label>天數</label>
            <input type="text" id="edit-sch-day" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>開始時間</label>
            <input type="time" id="edit-sch-start" required>
          </div>
          <div class="form-group">
            <label>結束時間</label>
            <input type="time" id="edit-sch-end" required>
          </div>
        </div>
        <div class="form-group">
          <label>地點 / 景點 / 行程內容</label>
          <input type="text" id="edit-sch-place" required>
        </div>
        <div class="form-group">
          <label>備註 / 停留時間</label>
          <input type="text" id="edit-sch-duration">
        </div>
        <button type="submit" class="btn">儲存變更</button>
      </form>
    </div>
  </div>

  <!-- 編輯代購 Modal -->
  <div id="edit-buy-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <span>✏️ 編輯代購商品</span>
        <button class="modal-close" onclick="closeModal('edit-buy-modal')">✕</button>
      </div>
      <form id="edit-buy-form">
        <input type="hidden" id="edit-buy-id">
        <div class="form-group">
          <label>商品名稱</label>
          <input type="text" id="edit-buy-name" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>分類</label>
            <select id="edit-buy-category">
              <option value="藥妝">藥妝</option>
              <option value="零食">零食</option>
              <option value="動漫/玩具">動漫/玩具</option>
              <option value="電器">電器</option>
              <option value="服飾">服飾</option>
              <option value="其他">其他</option>
            </select>
          </div>
          <div class="form-group">
            <label>數量</label>
            <input type="number" id="edit-buy-qty" min="1" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>日幣單價 (円)</label>
            <input type="number" id="edit-buy-price" required>
          </div>
          <div class="form-group">
            <label>委託人</label>
            <input type="text" id="edit-buy-owner" required>
          </div>
        </div>
        <button type="submit" class="btn">儲存變更</button>
      </form>
    </div>
  </div>

  <!-- 底部分頁導覽列 -->
  <nav id="detail-nav-bar" class="nav-bar" style="display: none;">
    <button class="nav-item active" onclick="switchTab('schedule')">
      <span class="nav-icon">🗺️</span>
      行程規劃
    </button>
    <button class="nav-item" onclick="switchTab('buy')">
      <span class="nav-icon">🛍️</span>
      代購清單
    </button>
  </nav>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // 您的 Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyDCNbwIV1iMoxwlPL7a4xEbMwpMv75sOak",
      authDomain: "japan-trip-701cd.firebaseapp.com",
      projectId: "japan-trip-701cd",
      storageBucket: "japan-trip-701cd.firebasestorage.app",
      messagingSenderId: "811979985418",
      appId: "1:811979985418:web:e3e93cf122f780af4585f3",
      measurementId: "G-62BVTK2QEZ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let trips = [];
    let currentTripId = null;
    const TODAY_REFERENCE_RATE = 0.2057;
    const TODAY_REFERENCE_DATE = '2026-09-16';
    let exchangeRate = TODAY_REFERENCE_RATE;

    // Realtime Sync
    db.collection("trips").onSnapshot(snapshot => {
      trips = [];
      snapshot.forEach(doc => {
        trips.push({ id: doc.id, ...doc.data() });
      });
      renderTripsList();
      if (currentTripId) {
        renderSchedules();
        updateOwnerFilterOptions();
        renderBuyList();
      }
    });

    db.collection("settings").doc("rate").onSnapshot(doc => {
      if (doc.exists) {
        exchangeRate = parseFloat(doc.data().val) || TODAY_REFERENCE_RATE;
        document.getElementById('exchange-rate').value = exchangeRate;
      } else {
        exchangeRate = TODAY_REFERENCE_RATE;
        document.getElementById('exchange-rate').value = TODAY_REFERENCE_RATE;
      }
      if (currentTripId) renderBuyList();
    });

    document.getElementById('rate-reference-date').textContent = TODAY_REFERENCE_DATE;
    document.getElementById('rate-reference-value').textContent = TODAY_REFERENCE_RATE.toFixed(4);

    // 折疊表單控制
    function toggleCollapsible(bodyId, iconId) {
      const body = document.getElementById(bodyId);
      const icon = document.getElementById(iconId);
      const isOpen = body.classList.contains('show');
      body.classList.toggle('show', !isOpen);
      icon.innerText = isOpen ? '＋' : '✕';
    }

    // Modal 控制
    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('show');
    }

    // 頁面切換
    function showTripsView() {
      currentTripId = null;
      document.getElementById('view-trips').classList.add('active');
      document.getElementById('view-detail').classList.remove('active');
      document.getElementById('detail-nav-bar').style.display = 'none';
      document.getElementById('back-to-trips-btn').style.visibility = 'hidden';
      document.getElementById('header-title').innerText = '日本自由行';
      renderTripsList();
    }

    function openTripDetail(tripId) {
      currentTripId = tripId;
      const trip = trips.find(t => t.id === tripId);
      if (!trip) return;

      document.getElementById('view-trips').classList.remove('active');
      document.getElementById('view-detail').classList.add('active');
      document.getElementById('detail-nav-bar').style.display = 'flex';
      document.getElementById('back-to-trips-btn').style.visibility = 'visible';
      document.getElementById('header-title').innerText = trip.name;

      switchTab('schedule');
    }

    function toggleQuickPanel(panelId) {
      const panel = document.getElementById(panelId);
      const isOpen = panel.classList.contains('show');
      document.querySelectorAll('.quick-panel').forEach(p => p.classList.remove('show'));
      document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
      if (!isOpen) {
        panel.classList.add('show');
        const btn = document.querySelector(`[onclick="toggleQuickPanel('${panelId}')"]`);
        if (btn) btn.classList.add('active');
      }
    }

    function openAddSchedule() {
      document.querySelectorAll('.quick-panel').forEach(p => p.classList.remove('show'));
      document.getElementById('sch-form-body').classList.add('show');
      document.getElementById('add-panel').classList.add('show');
      document.getElementById('sch-date').focus();
    }

    function openAddBuy() {
      document.querySelectorAll('.quick-panel').forEach(p => p.classList.remove('show'));
      document.getElementById('buy-form-body').classList.add('show');
      document.getElementById('add-panel').classList.add('show');
      document.getElementById('buy-name').focus();
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('#detail-nav-bar .nav-item').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.quick-panel').forEach(el => el.classList.remove('show'));
      document.querySelectorAll('.quick-btn').forEach(el => el.classList.remove('active'));

      const isSchedule = tabName === 'schedule';
      document.getElementById(isSchedule ? 'tab-schedule' : 'tab-buy').classList.add('active');
      document.querySelectorAll('#detail-nav-bar .nav-item')[isSchedule ? 0 : 1].classList.add('active');
      document.getElementById('quick-rate-btn').style.display = isSchedule ? 'none' : 'block';
      document.getElementById('quick-filter-btn').style.display = isSchedule ? 'none' : 'block';
      document.getElementById('add-schedule-shortcut').style.display = isSchedule ? 'block' : 'none';
      document.getElementById('add-buy-shortcut').style.display = isSchedule ? 'none' : 'block';

      if (isSchedule) renderSchedules();
      else {
        updateOwnerFilterOptions();
        renderBuyList();
      }
    }

    // 1. 旅程管理
    document.getElementById('trip-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const newTrip = {
        name: document.getElementById('trip-name').value.trim(),
        startDate: document.getElementById('trip-start-date').value,
        endDate: document.getElementById('trip-end-date').value,
        schedules: [],
        buyItems: []
      };
      db.collection("trips").add(newTrip);
      this.reset();
      toggleCollapsible('trip-form-body', 'trip-form-icon');
    });

    function deleteTrip(id, e) {
      e.stopPropagation();
      if (confirm('確定要刪除整個旅程嗎？')) {
        db.collection("trips").doc(id).delete();
      }
    }

    function renderTripsList() {
      const listEl = document.getElementById('trips-list');
      listEl.innerHTML = '';

      if (trips.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; color:var(--sub-text); padding:30px 0;">尚無旅程，請點擊上方 + 新增自由行程</div>';
        return;
      }

      trips.forEach(trip => {
        const card = document.createElement('div');
        card.className = 'card trip-card';
        card.onclick = () => openTripDetail(trip.id);
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <span style="font-size:1.15rem; font-weight:700;">${trip.name}</span>
            <button class="btn-sm btn-danger" onclick="deleteTrip('${trip.id}', event)">刪除</button>
          </div>
          <div style="font-size:0.85rem; color:var(--sub-text);">🗓️ ${trip.startDate} ～ ${trip.endDate}</div>
        `;
        listEl.appendChild(card);
      });
    }

    // 2. 行程細項管理
    document.getElementById('schedule-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const trip = trips.find(t => t.id === currentTripId);
      if (!trip) return;

      const newItem = {
        id: Date.now(),
        date: document.getElementById('sch-date').value,
        day: document.getElementById('sch-day').value.trim(),
        startTime: document.getElementById('sch-start').value,
        endTime: document.getElementById('sch-end').value,
        place: document.getElementById('sch-place').value.trim(),
        duration: document.getElementById('sch-duration').value.trim()
      };

      const updatedSchedules = [...(trip.schedules || []), newItem];
      // 按日期與時間排序
      updatedSchedules.sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));

      db.collection("trips").doc(currentTripId).update({ schedules: updatedSchedules });
      this.reset();
      document.getElementById('sch-form-body').classList.remove('show');
      document.getElementById('add-panel').classList.remove('show');
    });

    function openEditSchedule(id) {
      const trip = trips.find(t => t.id === currentTripId);
      if (!trip) return;
      const item = trip.schedules.find(s => s.id === id);
      if (!item) return;

      document.getElementById('edit-sch-id').value = item.id;
      document.getElementById('edit-sch-date').value = item.date;
      document.getElementById('edit-sch-day').value = item.day;
      document.getElementById('edit-sch-start').value = item.startTime;
      document.getElementById('edit-sch-end').value = item.endTime;
      document.getElementById('edit-sch-place').value = item.place;
      document.getElementById('edit-sch-duration').value = item.duration || '';

      document.getElementById('edit-sch-modal').classList.add('show');
    }

    document.getElementById('edit-sch-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const trip = trips.find(t => t.id === currentTripId);
      if (!trip) return;

      const id = parseInt(document.getElementById('edit-sch-id').value);
      const updatedSchedules = trip.schedules.map(item => {
        if (item.id === id) {
          return {
            id: id,
            date: document.getElementById('edit-sch-date').value,
            day: document.getElementById('edit-sch-day').value.trim(),
            startTime: document.getElementById('edit-sch-start').value,
            endTime: document.getElementById('edit-sch-end').value,
            place: document.getElementById('edit-sch-place').value.trim(),
            duration: document.getElementById('edit-sch-duration').value.trim()
          };
        }
        return item;
      });

      updatedSchedules.sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));

      db.collection("trips").doc(currentTripId).update({ schedules: updatedSchedules });
      closeModal('edit-sch-modal');
    });

    function deleteSchedule(id) {
      if (confirm('確定刪除此行程細項？')) {
        const trip = trips.find(t => t.id === currentTripId);
        if (trip) {
          const updatedSchedules = trip.schedules.filter(s => s.id !== id);
          db.collection("trips").doc(currentTripId).update({ schedules: updatedSchedules });
        }
      }
    }

    function renderSchedules() {
      const listEl = document.getElementById('schedule-list');
      listEl.innerHTML = '';
      const trip = trips.find(t => t.id === currentTripId);
      if (!trip || !trip.schedules || trip.schedules.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; color:var(--sub-text); padding:30px 0;">尚無行程細項，點擊置頂「＋ 新增」</div>';
        return;
      }

      const sorted = [...trip.schedules].sort((a,b) =>
        (a.date + a.startTime).localeCompare(b.date + b.startTime)
      );
      const groups = {};
      sorted.forEach(item => {
        if (!groups[item.date]) groups[item.date] = [];
        groups[item.date].push(item);
      });

      const dates = Object.keys(groups).sort();
      dates.forEach((date, index) => {
        const items = groups[date];
        const day = items[0].day || `Day ${index + 1}`;
        const completed = items.filter(i => i.completed).length;
        const progress = Math.round((completed / items.length) * 100);
        const wrap = document.createElement('div');
        wrap.className = 'schedule-day';
        wrap.innerHTML = `
          <div class="schedule-day-header" onclick="toggleDayGroup('${date}')">
            <span class="schedule-day-arrow" id="arrow-${date}">›</span>
            <div class="schedule-day-main">
              <div class="schedule-day-title">${day} · ${date}</div>
              <div class="schedule-day-sub">${items.length} 個時間段 · ${completed}/${items.length} 已完成</div>
            </div>
            <div class="schedule-progress"><span style="width:${progress}%"></span></div>
          </div>
          <div class="schedule-items ${index === 0 ? 'show' : ''}" id="day-items-${date}">
            ${items.map(item => `
              <div class="timeline-item">
                <div class="timeline-time">${item.startTime}–${item.endTime}</div>
                <div class="timeline-line"></div>
                <div class="timeline-content">
                  <div class="timeline-title">${item.place}</div>
                  ${item.duration ? `<div class="timeline-note">📌 ${item.duration}</div>` : ''}
                </div>
                <div class="timeline-actions">
                  <button class="btn-sm btn-edit" onclick="openEditSchedule(${item.id})">編輯</button>
                  <button class="btn-sm btn-danger" onclick="deleteSchedule(${item.id})">刪除</button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
        listEl.appendChild(wrap);
      });
    }

    function toggleDayGroup(date) {
      const body = document.getElementById(`day-items-${date}`);
      const arrow = document.getElementById(`arrow-${date}`);
      if (!body) return;
      const show = body.classList.toggle('show');
      if (arrow) arrow.textContent = show ? '⌄' : '›';
    }

    // 3. 代購管理
    function updateRate() {
      const val = parseFloat(document.getElementById('exchange-rate').value);
      if (!isNaN(val) && val > 0) {
        db.collection("settings").doc("rate").set({ val: val, updatedAt: new Date().toISOString() });
      }
    }

    document.getElementById('buy-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const trip = trips.find(t => t.id === currentTripId);
      if (!trip) return;

      const newItem = {
        id: Date.now(),
        name: document.getElementById('buy-name').value.trim(),
        category: document.getElementById('buy-category').value,
        qty: parseInt(document.getElementById('buy-qty').value),
        priceJpy: parseFloat(document.getElementById('buy-price').value),
        owner: document.getElementById('buy-owner').value.trim(),
        bought: false
      };

      const updatedBuyItems = [...(trip.buyItems || []), newItem];
      db.collection("trips").doc(currentTripId).update({ buyItems: updatedBuyItems });
      this.reset();
      document.getElementById('buy-form-body').classList.remove('show');
      document.getElementById('add-panel').classList.remove('show');
    });

    function openEditBuyItem(id) {
      const trip = trips.find(t => t.id === currentTripId);
      if (!trip) return;
      const item = trip.buyItems.find(i => i.id === id);
      if (!item) return;

      document.getElementById('edit-buy-id').value = item.id;
      document.getElementById('edit-buy-name').value = item.name;
      document.getElementById('edit-buy-category').value = item.category;
      document.getElementById('edit-buy-qty').value = item.qty;
      document.getElementById('edit-buy-price').value = item.priceJpy;
      document.getElementById('edit-buy-owner').value = item.owner;

      document.getElementById('edit-buy-modal').classList.add('show');
    }

    document.getElementById('edit-buy-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const trip = trips.find(t => t.id === currentTripId);
      if (!trip) return;

      const id = parseInt(document.getElementById('edit-buy-id').value);
      const updatedBuyItems = trip.buyItems.map(item => {
        if (item.id === id) {
          return {
            ...item,
            name: document.getElementById('edit-buy-name').value.trim(),
            category: document.getElementById('edit-buy-category').value,
            qty: parseInt(document.getElementById('edit-buy-qty').value),
            priceJpy: parseFloat(document.getElementById('edit-buy-price').value),
            owner: document.getElementById('edit-buy-owner').value.trim()
          };
        }
        return item;
      });

      db.collection("trips").doc(currentTripId).update({ buyItems: updatedBuyItems });
      closeModal('edit-buy-modal');
    });

    function toggleBought(id) {
      const trip = trips.find(t => t.id === currentTripId);
      if (trip && trip.buyItems) {
        const updatedBuyItems = trip.buyItems.map(item => {
          if (item.id === id) return { ...item, bought: !item.bought };
          return item;
        });
        db.collection("trips").doc(currentTripId).update({ buyItems: updatedBuyItems });
      }
    }

    function deleteBuyItem(id) {
      if (confirm('確定刪除此代購商品？')) {
        const trip = trips.find(t => t.id === currentTripId);
        if (trip && trip.buyItems) {
          const updatedBuyItems = trip.buyItems.filter(i => i.id !== id);
          db.collection("trips").doc(currentTripId).update({ buyItems: updatedBuyItems });
        }
      }
    }

    function updateOwnerFilterOptions() {
      const select = document.getElementById('filter-owner');
      const currentVal = select.value;
      const trip = trips.find(t => t.id === currentTripId);
      const items = (trip && trip.buyItems) ? trip.buyItems : [];
      const owners = [...new Set(items.map(i => i.owner))];

      select.innerHTML = '<option value="ALL">全部委託人</option>';
      owners.forEach(owner => {
        const opt = document.createElement('option');
        opt.value = owner;
        opt.innerText = owner;
        select.appendChild(opt);
      });
      select.value = currentVal;
    }

    function renderBuyList() {
      const listEl = document.getElementById('buy-list');
      listEl.innerHTML = '';
      const trip = trips.find(t => t.id === currentTripId);
      const items = (trip && trip.buyItems) ? trip.buyItems : [];

      const catFilter = document.getElementById('filter-category').value;
      const statusFilter = document.getElementById('filter-status').value;
      const ownerFilter = document.getElementById('filter-owner').value;

      let filtered = items.filter(item => {
        if (catFilter !== 'ALL' && item.category !== catFilter) return false;
        if (statusFilter === 'BOUGHT' && !item.bought) return false;
        if (statusFilter === 'UNBOUGHT' && item.bought) return false;
        if (ownerFilter !== 'ALL' && item.owner !== ownerFilter) return false;
        return true;
      });

      filtered.sort((a,b) => (a.bought === b.bought ? 0 : a.bought ? 1 : -1));

      if (filtered.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; color:var(--sub-text); padding:30px 0;">無符合條件的代購項目</div>';
        return;
      }

      const owners = {};
      filtered.forEach(item => {
        if (!owners[item.owner]) owners[item.owner] = [];
        owners[item.owner].push(item);
      });

      Object.keys(owners).sort((a,b) => a.localeCompare(b,'zh-Hant')).forEach((owner, idx) => {
        const ownerItems = owners[owner];
        const bought = ownerItems.filter(i => i.bought).length;
        const group = document.createElement('div');
        group.className = 'owner-group';
        group.innerHTML = `
          <div class="owner-header" onclick="toggleOwnerGroup(${idx})">
            <div>
              <div class="owner-title">👤 ${owner}</div>
              <div class="owner-meta">${ownerItems.length} 項商品 · ${bought}/${ownerItems.length} 已購買</div>
            </div>
            <span id="owner-arrow-${idx}" style="color:var(--primary-color);font-weight:800;">${idx === 0 ? '⌄' : '›'}</span>
          </div>
          <div class="owner-items ${idx === 0 ? 'show' : ''}" id="owner-items-${idx}">
            ${ownerItems.map(item => {
              const twpTotal = Math.round(item.priceJpy * item.qty * exchangeRate);
              return `
                <div class="buy-row ${item.bought ? 'bought' : ''}">
                  <div class="checkbox-custom ${item.bought ? 'checked' : ''}" onclick="toggleBought(${item.id})"></div>
                  <div class="buy-main">
                    <div class="buy-line">
                      <span class="buy-name">${item.name}</span>
                      <span class="tag">${item.category}</span>
                    </div>
                    <div class="buy-detail">數量 ${item.qty} × ¥${item.priceJpy.toLocaleString()} · ${item.bought ? '已購買' : '待購買'}</div>
                  </div>
                  <div>
                    <div class="buy-total">NT$ ${twpTotal.toLocaleString()}</div>
                    <div class="buy-actions">
                      <button class="btn-sm btn-edit" onclick="openEditBuyItem(${item.id})">編輯</button>
                      <button class="btn-sm btn-danger" onclick="deleteBuyItem(${item.id})">刪除</button>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
        listEl.appendChild(group);
      });
    }

    function toggleOwnerGroup(index) {
      const body = document.getElementById(`owner-items-${index}`);
      const arrow = document.getElementById(`owner-arrow-${index}`);
      if (!body) return;
      const show = body.classList.toggle('show');
      if (arrow) arrow.textContent = show ? '⌄' : '›';
    }

    renderTripsList();
  </script>
</body>
</html>
