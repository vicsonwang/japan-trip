<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>日本自由行規劃</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    body {
      padding-bottom: env(safe-area-inset-bottom);
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       Login
    ========================= */

    #login-overlay {
      position: fixed;
      inset: 0;
      z-index: 3000;
      background: rgba(245, 245, 247, 0.98);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: min(420px, 100%);
      background: #fff;
      border-radius: 28px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
    }

    .login-logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      border-radius: 22px;
      background: linear-gradient(135deg, #ff5f6d, #ffc371);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 34px;
      font-weight: 800;
    }

    .login-card h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .login-card p {
      margin: 0 0 28px;
      color: #86868b;
      line-height: 1.6;
      font-size: 14px;
    }

    #google-login-btn {
      width: 100%;
      min-height: 52px;
      border: 1px solid #d2d2d7;
      background: #fff;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      color: #1d1d1f;
      transition: 0.2s;
    }

    #google-login-btn:hover {
      background: #f5f5f7;
    }

    #google-login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #login-error {
      margin-top: 14px;
      color: #ff3b30;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    /* =========================
       Header
    ========================= */

    .app-header {
      position: sticky;
      top: 0;
      z-index: 500;
      background: rgba(245, 245, 247, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }

    .header-inner {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff5f6d, #ff9966);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex: 0 0 auto;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-subtitle {
      font-size: 11px;
      color: #86868b;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .user-name {
      max-width: 130px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 13px;
      color: #6e6e73;
    }

    .logout-btn {
      border: 0;
      background: #fff;
      color: #ff3b30;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
    }

    /* =========================
       Main
    ========================= */

    .app-main {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 110px;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .page-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }

    .page-title {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.5px;
    }

    .page-subtitle {
      margin: 6px 0 0;
      color: #86868b;
      font-size: 13px;
    }

    /* =========================
       Buttons
    ========================= */

    .btn {
      border: 0;
      border-radius: 12px;
      min-height: 42px;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 700;
      transition: 0.18s;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #007aff;
      color: #fff;
    }

    .btn-primary:hover {
      background: #006ee6;
    }

    .btn-secondary {
      background: #f2f2f7;
      color: #1d1d1f;
    }

    .btn-danger {
      background: #fff0ef;
      color: #ff3b30;
    }

    .btn-small {
      min-height: 34px;
      padding: 0 11px;
      font-size: 12px;
      border-radius: 9px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      padding: 0;
      border: 0;
      border-radius: 11px;
      background: #f2f2f7;
      font-size: 17px;
    }

    /* =========================
       Trip list
    ========================= */

    .trip-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .trip-card {
      background: #fff;
      border-radius: 20px;
      padding: 22px;
      border: 1px solid rgba(0, 0, 0, 0.05);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.04);
      transition: 0.2s;
      cursor: pointer;
    }

    .trip-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.08);
    }

    .trip-card-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .trip-name {
      font-size: 19px;
      font-weight: 800;
      line-height: 1.35;
    }

    .trip-date {
      color: #86868b;
      font-size: 13px;
      margin-top: 8px;
    }

    .trip-owner {
      margin-top: 18px;
      font-size: 12px;
      color: #86868b;
    }

    .trip-code {
      display: inline-flex;
      margin-top: 12px;
      background: #f2f2f7;
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 11px;
      color: #6e6e73;
      letter-spacing: 0.4px;
    }

    .empty-state {
      background: #fff;
      border-radius: 20px;
      padding: 48px 24px;
      text-align: center;
      color: #86868b;
    }

    .empty-state-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    /* =========================
       Trip detail
    ========================= */

    .trip-detail-header {
      margin-bottom: 20px;
    }

    .back-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .trip-detail-title {
      font-size: 28px;
      font-weight: 800;
      margin: 0;
    }

    .trip-detail-date {
      margin-top: 6px;
      color: #86868b;
      font-size: 13px;
    }

    /* =========================
       Tabs
    ========================= */

    .tab-bar {
      background: #e9e9ee;
      padding: 4px;
      border-radius: 13px;
      display: flex;
      gap: 3px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      border: 0;
      background: transparent;
      min-height: 42px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      color: #6e6e73;
    }

    .tab-btn.active {
      background: #fff;
      color: #1d1d1f;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    /* =========================
       Toolbar
    ========================= */

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .toolbar-item {
      background: #fff;
      border-radius: 11px;
      min-height: 38px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #6e6e73;
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    .toolbar-item strong {
      color: #1d1d1f;
    }

    .filter-panel {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 18px;
      display: none;
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    .filter-panel.show {
      display: block;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .filter-label {
      display: block;
      font-size: 11px;
      color: #86868b;
      margin-bottom: 5px;
    }

    /* =========================
       Schedule
    ========================= */

    .schedule-day {
      margin-bottom: 22px;
    }

    .day-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .day-badge {
      min-width: 56px;
      padding: 6px 10px;
      border-radius: 10px;
      background: #1d1d1f;
      color: #fff;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
    }

    .day-date {
      font-size: 14px;
      font-weight: 700;
    }

    .day-toggle {
      margin-left: auto;
      border: 0;
      background: transparent;
      color: #86868b;
      font-size: 13px;
    }

    .schedule-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .schedule-card {
      background: #fff;
      border-radius: 16px;
      padding: 14px;
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) auto;
      gap: 13px;
      align-items: start;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    .schedule-time {
      font-size: 12px;
      color: #007aff;
      font-weight: 800;
      line-height: 1.45;
    }

    .schedule-place {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.4;
      word-break: break-word;
    }

    .schedule-meta {
      margin-top: 4px;
      font-size: 11px;
      color: #86868b;
    }

    .schedule-actions {
      display: flex;
      gap: 5px;
    }

    .schedule-action {
      width: 31px;
      height: 31px;
      border: 0;
      border-radius: 8px;
      background: #f2f2f7;
      font-size: 13px;
    }

    /* =========================
       Buy list
    ========================= */

    .buy-owner-section {
      margin-bottom: 20px;
    }

    .buy-owner-header {
      background: #fff;
      border-radius: 15px 15px 0 0;
      padding: 13px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid #f0f0f2;
    }

    .buy-owner-title {
      font-size: 14px;
      font-weight: 800;
    }

    .buy-owner-summary {
      color: #86868b;
      font-size: 11px;
    }

    .buy-owner-items {
      background: #fff;
      border-radius: 0 0 15px 15px;
      overflow: hidden;
    }

    .buy-item-line {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      gap: 9px;
      align-items: center;
      padding: 11px 13px;
      border-bottom: 1px solid #f2f2f7;
    }

    .buy-item-line:last-child {
      border-bottom: 0;
    }

    .buy-item-body {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .buy-item-content {
      min-width: 0;
      flex: 1;
    }

    .buy-item-name {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      word-break: break-word;
    }

    .buy-item-meta {
      margin-top: 3px;
      color: #86868b;
      font-size: 10px;
      line-height: 1.4;
    }

    .buy-item-price {
      margin-top: 3px;
      font-size: 11px;
      color: #1d1d1f;
      font-weight: 700;
    }

    .buy-actions {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .buy-action {
      width: 31px;
      height: 31px;
      border: 0;
      border-radius: 8px;
      background: #f2f2f7;
      font-size: 13px;
    }

    .checkbox-custom {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid #c7c7cc;
      background: #fff;
      position: relative;
      cursor: pointer;
    }

    .checkbox-custom.checked {
      background: #34c759;
      border-color: #34c759;
    }

    .checkbox-custom.checked::after {
      content: "✓";
      color: #fff;
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
    }

    /* =========================
       Photos
    ========================= */

    .photo-thumb {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      border-radius: 10px;
      object-fit: cover;
      background: #f2f2f7;
      display: block;
    }

    .photo-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8e8e93;
      font-size: 19px;
    }

    .photo-preview {
      margin-top: 10px;
      min-height: 0;
    }

    .photo-preview img {
      display: block;
      width: 100%;
      max-width: 220px;
      max-height: 180px;
      object-fit: cover;
      border-radius: 12px;
      background: #f2f2f7;
    }

    .photo-status {
      margin-top: 7px;
      color: #86868b;
      font-size: 11px;
    }

    /* =========================
       Form
    ========================= */

    .form-card {
      background: #fff;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .form-group {
      min-width: 0;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #6e6e73;
    }

    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;
      border: 1px solid #d2d2d7;
      background: #fff;
      border-radius: 11px;
      min-height: 42px;
      padding: 9px 11px;
      outline: none;
      font-size: 14px;
      color: #1d1d1f;
    }

    .form-textarea {
      min-height: 90px;
      resize: vertical;
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      border-color: #007aff;
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    /* =========================
       Modal
    ========================= */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(0, 0, 0, 0.42);
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: min(650px, 100%);
      max-height: 92vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 24px 24px 0 0;
      padding: 22px;
      animation: modalUp 0.2s ease;
    }

    @keyframes modalUp {
      from {
        transform: translateY(30px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .modal-title {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
    }

    .modal-close {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: #f2f2f7;
      font-size: 20px;
    }

    /* =========================
       Quick panel
    ========================= */

    .quick-panel {
      display: none;
      background: #fff;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 16px;
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    .quick-panel.show {
      display: block;
    }

    .quick-panel-title {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .quick-rate-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .rate-value {
      font-size: 22px;
      font-weight: 800;
    }

    .rate-note {
      color: #86868b;
      font-size: 11px;
    }

    /* =========================
       Bottom navigation
    ========================= */

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
      padding:
        7px
        max(8px, env(safe-area-inset-right))
        calc(7px + env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(0, 0, 0, 0.08);
    }

    .bottom-nav-inner {
      width: min(700px, 100%);
      margin: 0 auto;
      display: flex;
      justify-content: center;
      gap: 5px;
    }

    .nav-btn {
      flex: 1;
      max-width: 180px;
      border: 0;
      background: transparent;
      border-radius: 12px;
      min-height: 45px;
      color: #86868b;
      font-size: 11px;
      font-weight: 700;
    }

    .nav-btn.active {
      background: #f2f2f7;
      color: #007aff;
    }

    /* =========================
       Loading
    ========================= */

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 45px 20px;
      color: #86868b;
      font-size: 13px;
    }

    .loading-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #007aff;
      margin-right: 8px;
      animation: loadingPulse 0.9s infinite alternate;
    }

    @keyframes loadingPulse {
      from {
        opacity: 0.3;
      }

      to {
        opacity: 1;
      }
    }

    /* =========================
       Responsive
    ========================= */

    @media (max-width: 760px) {
      .app-main,
      .header-inner {
        width: min(100% - 22px, 1100px);
      }

      .trip-grid {
        grid-template-columns: 1fr;
      }

      .filter-grid {
        grid-template-columns: 1fr;
      }

      .schedule-card {
        grid-template-columns: 62px minmax(0, 1fr) auto;
      }
    }

    @media (max-width: 520px) {
      .app-main {
        padding-top: 20px;
      }

      .page-title {
        font-size: 24px;
      }

      .brand-subtitle {
        display: none;
      }

      .user-name {
        display: none;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .schedule-card {
        grid-template-columns: 56px minmax(0, 1fr);
      }

      .schedule-actions {
        grid-column: 2;
      }

      .buy-item-line {
        grid-template-columns: 22px minmax(0, 1fr) auto;
        padding: 10px 9px;
      }

      .buy-actions {
        gap: 3px;
      }

      .buy-action {
        width: 29px;
        height: 29px;
      }

      .photo-thumb {
        width: 50px;
        height: 50px;
        flex-basis: 50px;
      }

      .modal-card {
        padding: 18px 15px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       Login
  ========================== -->

  <div id="login-overlay">
    <div class="login-card">
      <div class="login-logo">✈️</div>

      <h1>日本自由行</h1>

      <p>
        登入 Google 後即可同步旅程資料，<br>
        並使用 Google Drive 私人照片儲存功能。
      </p>

      <button id="google-login-btn">
        <span style="font-weight:800; color:#4285f4; margin-right:8px;">G</span>
        使用 Google 帳號登入
      </button>

      <div id="login-error"></div>
    </div>
  </div>

  <!-- =========================
       Header
  ========================== -->

  <header class="app-header">
    <div class="header-inner">

      <div class="brand">
        <div class="brand-icon">🇯🇵</div>

        <div class="brand-text">
          <div class="brand-title">日本自由行</div>
          <div class="brand-subtitle">Trip Planner</div>
        </div>
      </div>

      <div class="user-area">
        <div id="user-name" class="user-name"></div>

        <button
          id="logout-btn"
          class="logout-btn"
          style="display:none;"

  <script>

    /* =========================================================
       Firebase
    ========================================================= */

    const firebaseConfig = {
      apiKey: "AIzaSyDCNbwIV1iMoxwlPL7a4xEbMwpMv75sOak",
      authDomain: "japan-trip-701cd.firebaseapp.com",
      projectId: "japan-trip-701cd",
      storageBucket: "japan-trip-701cd.firebasestorage.app",
      messagingSenderId: "811979985418",
      appId: "1:811979985418:web:e3e93cf122f780af4585f3",
      measurementId: "G-62BVTK2QEZ"
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();
    const auth = firebase.auth();


    /* =========================================================
       Global State
    ========================================================= */

    const TODAY_REFERENCE_RATE = 0.22;

    let trips = [];
    let currentTripId = null;

    let tripsUnsubscribe = null;
    let rateUnsubscribe = null;

    /*
      Google Drive OAuth token

      注意：
      Firebase Auth 本身不會在重新整理頁面後保留 Drive access token，
      因此第一次需要照片時，會透過 reauthenticateWithPopup 重新取得。
    */
    let googleDriveAccessToken = null;

    let exchangeRate = TODAY_REFERENCE_RATE;


    /* =========================================================
       Utility
    ========================================================= */

    function escapeHtml(value) {
      if (value === null || value === undefined) {
        return '';
      }

      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }


    function formatDate(dateString) {
      if (!dateString) return '';

      const date = new Date(dateString + 'T00:00:00');

      if (Number.isNaN(date.getTime())) {
        return dateString;
      }

      return date.toLocaleDateString('zh-TW', {
        year: 'numeric',
        month: 'numeric',
        day: 'numeric'
      });
    }


    function formatNumber(value) {
      const number = Number(value) || 0;

      return number.toLocaleString('zh-TW');
    }


    function addMinutesToTime(timeString, minutes) {
      if (!timeString) return '';

      const parts = timeString.split(':');

      if (parts.length < 2) {
        return '';
      }

      let hours = parseInt(parts[0], 10);
      let mins = parseInt(parts[1], 10);

      if (
        Number.isNaN(hours) ||
        Number.isNaN(mins)
      ) {
        return '';
      }

      let total = hours * 60 + mins + minutes;

      total = Math.min(total, 23 * 60 + 59);

      hours = Math.floor(total / 60);
      mins = total % 60;

      return (
        String(hours).padStart(2, '0') +
        ':' +
        String(mins).padStart(2, '0')
      );
    }


    function getDayLabel(dateString) {
      if (!dateString) return '';

      const date = new Date(dateString + 'T00:00:00');

      if (Number.isNaN(date.getTime())) {
        return '';
      }

      const weekday = [
        '日',
        '一',
        '二',
        '三',
        '四',
        '五',
        '六'
      ];

      return '週' + weekday[date.getDay()];
    }


    function getCurrentTrip() {
      return trips.find(
        trip => trip.id === currentTripId
      );
    }


    /* =========================================================
       Authentication
    ========================================================= */

    auth.onAuthStateChanged(async user => {

      const loginOverlay =
        document.getElementById('login-overlay');

      const userName =
        document.getElementById('user-name');

      const logoutBtn =
        document.getElementById('logout-btn');

      if (user) {

        console.log('✅ Firebase 使用者登入：', user.email);

        loginOverlay.style.display = 'none';

        userName.textContent =
          user.displayName ||
          user.email ||
          '';

        logoutBtn.style.display = 'block';

        /*
          每次 Firebase Auth 狀態重新建立後，
          舊的 Drive token 不應直接假設仍然有效。
        */
        googleDriveAccessToken = null;

        startTripSync(user);
        startRateSync();

      } else {

        console.log('ℹ️ 尚未登入');

        loginOverlay.style.display = 'flex';

        userName.textContent = '';

        logoutBtn.style.display = 'none';

        googleDriveAccessToken = null;

        stopTripSync();
        stopRateSync();

        trips = [];
        currentTripId = null;

        localStorage.removeItem('currentTripId');

        renderTripsList();
        showTripsView();
      }

    });


    document
      .getElementById('google-login-btn')
      .addEventListener('click', async () => {

        const btn =
          document.getElementById('google-login-btn');

        const error =
          document.getElementById('login-error');

        error.textContent = '';

        btn.disabled = true;

        btn.innerHTML =
          'Google 登入中…';

        try {

          const provider =
            new firebase.auth.GoogleAuthProvider();

          /*
            drive.file：
            允許此 App 建立 / 存取自己建立的 Drive 檔案。
          */
          provider.addScope(
            'https://www.googleapis.com/auth/drive.file'
          );

          const result =
            await auth.signInWithPopup(provider);

          googleDriveAccessToken =
            result &&
            result.credential
              ? result.credential.accessToken || null
              : null;

          console.log(
            '✅ Google 登入成功'
          );

          console.log(
            'Drive Token:',
            googleDriveAccessToken

    /* =========================================================
       Firestore Trip Sync
    ========================================================= */

    function stopTripSync() {

      if (typeof tripsUnsubscribe === 'function') {

        tripsUnsubscribe();

      }

      tripsUnsubscribe = null;
    }


    function startTripSync(user) {

      stopTripSync();

      if (!user) {
        trips = [];
        renderTripsList();
        return;
      }

      const savedTripId =
        localStorage.getItem('currentTripId');

      tripsUnsubscribe =
        db
          .collection('trips')
          .where(
            'memberUids',
            'array-contains',
            user.uid
          )
          .onSnapshot(
            snapshot => {

              trips = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
              }));

              console.log(
                '☁️ 旅程同步：',
                trips.length
              );

              renderTripsList();

              if (
                currentTripId &&
                !trips.some(
                  trip => trip.id === currentTripId
                )
              ) {

                currentTripId = null;

                localStorage.removeItem(
                  'currentTripId'
                );

                showTripsView();

                return;
              }

              if (
                !currentTripId &&
                savedTripId &&
                trips.some(
                  trip => trip.id === savedTripId
                )
              ) {

                openTripDetail(savedTripId);

              }

            },
            error => {

              console.error(
                '❌ Trip Snapshot Error：',
                error
              );

            }
          );
    }


    /* =========================================================
       Exchange Rate Sync
    ========================================================= */

    function stopRateSync() {

      if (typeof rateUnsubscribe === 'function') {
        rateUnsubscribe();
      }

      rateUnsubscribe = null;
    }


    function startRateSync() {

      stopRateSync();

      rateUnsubscribe =
        db
          .collection('settings')
          .doc('rate')
          .onSnapshot(
            doc => {

              if (doc.exists) {

                const data = doc.data();

                const rate =
                  Number(
                    data.rate ||
                    data.jpyToTwd ||
                    data.value
                  );

                if (
                  Number.isFinite(rate) &&
                  rate > 0
                ) {
                  exchangeRate = rate;
                }

              }

              const el =
                document.getElementById(
                  'exchange-rate'
                );

              if (el) {

                el.textContent =
                  exchangeRate.toFixed(4);

              }

            },
            error => {

              console.warn(
                '⚠️ 匯率同步失敗，使用預設匯率：',
                error
              );

              const el =
                document.getElementById(
                  'exchange-rate'
                );

              if (el) {
                el.textContent =
                  exchangeRate.toFixed(4);
              }

            }
          );
    }

    function openCreateTrip() {

      document

      const today =
        new Date()
          .toISOString()
          .slice(0, 10);

      document
        .getElementById('trip-start')

    document
      .getElementById('create-trip-form')
      .addEventListener(
        'submit',
        async event => {

          event.preventDefault();

          const user =
            auth.currentUser;

          if (!user) {
            alert('請先登入 Google 帳號');
            return;
          }

          const name =
            document
              .getElementById('trip-name')
              .value
              .trim();

          const startDate =
            document
              .getElementById('trip-start')
              .value;

          const endDate =
            document
              .getElementById('trip-end')
              .value;

          if (!name) {
            alert('請輸入旅程名稱');
            return;
          }

          if (
            startDate &&
            endDate &&
            startDate > endDate
          ) {
            alert('結束日期不能早於開始日期');
            return;
          }

          const inviteCode =
            Math.random()
              .toString(36)
              .slice(2, 8)
              .toUpperCase();

          try {

            const tripRef =
              await db
                .collection('trips')
                .add({
                  name,
                  startDate,
                  endDate,
                  inviteCode,
                  code: inviteCode,
                  schedules: [],
                  buyItems: [],
                  ownerUid: user.uid,
                  ownerName:
                    user.displayName ||
                    user.email ||
                    '',
                  memberUids: [
                    user.uid
                  ],
                  createdAt:
                    firebase.firestore.FieldValue.serverTimestamp()
                });

            console.log(
              '✅ 建立旅程：',
              tripRef.id
            );

            closeModal(
              'create-trip-modal'
            );

            currentTripId =
              tripRef.id;

            localStorage.setItem(
              'currentTripId',
              tripRef.id
            );

            /*
              直接使用本地建立的資料進入旅程，
              不必等待 Snapshot 才能開啟。
            */
            const newTrip = {
              id: tripRef.id,
              name,
              startDate,
              endDate,
              inviteCode,
              code: inviteCode,
              schedules: [],
              buyItems: [],
              ownerUid: user.uid,
              ownerName:
                user.displayName ||
                user.email ||
                '',
              memberUids: [
                user.uid
              ]
            };

            if (
              !trips.some(
                trip => trip.id === tripRef.id
              )
            ) {
              trips.push(newTrip);
            }

            openTripDetail(
              tripRef.id
            );

          } catch (err) {

            console.error(
              '❌ 建立旅程失敗：',
              err
            );

            alert(
              '建立旅程失敗：\n' +
              (
                err.message ||
                err
              )
            );

        }

    function setScheduleDefaults() {

      const trip =
        getCurrentTrip();

      if (!trip) return;

      const dateEl =
        document.getElementById(
          'sch-date'
        );

      const dayEl =
        document.getElementById(
          'sch-day'
        );

      const startEl =
        document.getElementById(
          'sch-start'
        );

      const endEl =
        document.getElementById(
          'sch-end'
        );

      if (!dateEl.value) {

        dateEl.value =
          trip.startDate ||
          new Date()
            .toISOString()
            .slice(0, 10);
      }

      dayEl.value =
        dayEl.value ||
        getDayLabel(
          dateEl.value
        );

      if (!startEl.value) {

        const schedules =
          Array.isArray(trip.schedules)
            ? trip.schedules
            : [];

        if (schedules.length) {

          const sorted =
            [...schedules].sort(
              (a, b) => {

                const aa =
                  `${a.date || ''} ${a.startTime || ''}`;

                const bb =
                  `${b.date || ''} ${b.startTime || ''}`;

                return aa.localeCompare(bb);
              }
            );

          startEl.value =
            sorted[sorted.length - 1]
              .endTime ||
            '09:00';

        } else {

          startEl.value =
            '09:00';
        }
      }

      if (!endEl.value) {

        endEl.value =
          addMinutesToTime(
            startEl.value,
            60
          );
      }
    }

    /* =========================================================
       Render Schedule
    ========================================================= */

    function renderSchedules() {

      const list =
        document.getElementById(
          'schedule-list'
        );

      const trip =
        getCurrentTrip();

      if (!list || !trip) {
        return;
      }

      const schedules =
        Array.isArray(trip.schedules)
          ? [...trip.schedules]
          : [];

      if (!schedules.length) {

        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🗓</div>

            <div style="font-weight:800; color:#1d1d1f; margin-bottom:6px;">
              還沒有行程
            </div>

            <div style="margin-bottom:18px;">
              從第一個景點開始規劃吧！
            </div>

            <button
              class="btn btn-primary"
              onclick="openAddSchedule()"
            >
              ＋ 新增行程
            </button>
          </div>
        `;

        return;
      }

      schedules.sort(
        (a, b) => {

          const aa =
            `${a.date || ''} ${a.startTime || ''}`;

          const bb =
            `${b.date || ''} ${b.startTime || ''}`;

          return aa.localeCompare(bb);
        }
      );

      const groups = {};

      schedules.forEach(item => {

        const key =
          item.date || '未指定日期';

        if (!groups[key]) {
          groups[key] = [];
        }

        groups[key].push(item);

      });

      const dates =
        Object.keys(groups).sort();

      list.innerHTML =
        dates.map(date => {

          const items =
            groups[date];

          const first =
            items[0];

          return `
            <div
              class="schedule-day"
              data-day="${escapeHtml(date)}"
            >

              <div class="day-header">

                <div class="day-badge">
                  ${escapeHtml(first.day || getDayLabel(date))}
                </div>

                <div class="day-date">
                  ${escapeHtml(formatDate(date))}
                </div>

                <button
                  class="day-toggle"
                  onclick="toggleDayGroup('${escapeHtml(date)}')"
                >
                  收合
                </button>

              </div>

              <div
                class="schedule-list"
                id="day-group-${escapeHtml(date)}"
              >

                ${items.map(item => {

                  const time =
                    item.endTime
                      ? `${item.startTime || '--:--'} ～ ${item.endTime}`
                      : `${item.startTime || '--:--'}`;

                  return `
                    <div class="schedule-card">

                      <div class="schedule-time">
                        ${escapeHtml(time)}
                      </div>

                      <div style="min-width:0;">

                        <div class="schedule-place">
                          ${escapeHtml(item.place || '未命名行程')}
                        </div>

                        <div class="schedule-meta">

                          ${
                            item.duration
                              ? `⏱ ${escapeHtml(item.duration)}`
                              : ''
                          }

                          ${
                            item.photoFileId || item.photoUrl
                              ? '　📷'
                              : ''
                          }

                        </div>

                      </div>

                      <div class="schedule-actions">

                        <button
                          class="schedule-action"
                          title="編輯"
                          onclick="openEditSchedule(${Number(item.id)})"
                        >
                          ✏️
                        </button>

                        <button
                          class="schedule-action"
                          title="刪除"
                          onclick="deleteSchedule(${Number(item.id)})"
                        >
                          🗑
                        </button>

                      </div>

                    </div>
                  `;

                }).join('')}

              </div>

            </div>
          `;

        }).join('');
    }

    function renderBuyList() {

      const list =

          .getElementById(

          )
          .value;

        document
          .getElementById(
            'buy-filter-owner'
          )
          .value;

      updateOwnerFilterOptions();
      updateCategoryFilterOptions();

      /*
        update options 後再讀取目前值，
        避免某些情況下 select value 被重設。
      */
      const actualCategoryFilter =
        document
          .getElementById(
            'buy-filter-category'
          )
          .value;

      const actualOwnerFilter =
        document
          .getElementById(
            'buy-filter-owner'
          )
          .value;

      const buyItems =
        Array.isArray(trip.buyItems)
          ? trip.buyItems
          : [];

      const filtered =
        buyItems.filter(item => {

          const category =
            item.category ||
            '未分類';

          const owner =
            item.owner ||
            '未指定';

          const bought =
            item.bought === true;

          if (
            actualCategoryFilter &&
            category !== actualCategoryFilter
          ) {
            return false;
          }

          if (
            statusFilter === 'todo' &&
            bought
          ) {
            return false;
          }

          if (
            statusFilter === 'done' &&
            !bought
          ) {
            return false;
          }

          if (
            actualOwnerFilter &&
            owner !== actualOwnerFilter
          ) {
            return false;
          }

          return true;
        });

      if (!filtered.length) {

        list.innerHTML = `
          <div class="empty-state">

            <div class="empty-state-icon">

    async function hydrateBuyDrivePhotos(listEl) {

      if (!listEl) return;

      const nodes =
        Array.from(
          listEl.querySelectorAll(
            '[data-drive-photo-id]'
          )
        );

      if (!nodes.length) {
        return;
      }

      try {

        /*
          先確定有 OAuth token。
          這裡只會在真的有私有 Drive 照片時執行。
        */
        await ensureGoogleDriveToken();

        await Promise.all(
          nodes.map(
            async node => {

              const fileId =
                node.dataset.drivePhotoId;

              if (!fileId) return;

              try {

                const url =
                  await getDrivePhotoUrl(
                    fileId
                  );

                if (
                  !url ||
                  !node.isConnected
                ) {
                  return;
                }

                const img =
                  document.createElement(
                    'img'
                  );

                img.className =
                  'photo-thumb';

                img.alt =
                  '商品照片';

                img.src =
                  url;

                img.onerror = () => {

                  console.error(
                    '❌ 商品照片顯示失敗：',
                    fileId
                  );

                  if (
                    img.isConnected
                  ) {
                    img.remove();
                  }
                };

                node.replaceWith(
                  img
                );

              } catch (err) {

                console.error(
                  '❌ 單張商品照片讀取失敗：',
                  fileId,
                  err
                );

                if (
                  node.isConnected
                ) {
                  node.remove();
                }

              }

            }
          )
        );

      } catch (err) {

        console.error(
          '❌ 商品 Drive 照片載入失敗：',
          err
        );

        nodes.forEach(node => {

          if (node.isConnected) {
            node.remove();
          }

        });
      }
    }

      const item =
        (trip.buyItems || [])
          .find(

              Number(buyItem.id) ===
              Number(id)

      if (!item) return;

      const confirmed =

      try {

        const buyItems =
          (trip.buyItems || [])

                Number(id)

        await db
          .collection('trips')
          .doc(trip.id)
          .update({
            buyItems

      } catch (err) {

          '❌ 刪除代購失敗：',
          err
        );

        alert(
          '刪除代購失敗：\n' +

            err.message ||

        );

    }

    /* =========================================================
       Google Drive OAuth
    ========================================================= */

    async function ensureGoogleDriveToken() {

      if (googleDriveAccessToken) {
        return googleDriveAccessToken;
      }

      if (!auth.currentUser) {
        throw new Error(
          '請先登入 Google 帳號'
        );
      }

      console.log(
        '🔐 重新取得 Google Drive OAuth Token'
      );

      const provider =
        new firebase.auth.GoogleAuthProvider();

      provider.addScope(
        'https://www.googleapis.com/auth/drive.file'
      );

      try {

        const result =
          await auth.currentUser
            .reauthenticateWithPopup(
              provider
            );

        googleDriveAccessToken =
          result &&
          result.credential
            ? result.credential.accessToken ||
              null
            : null;

      } catch (err) {

        console.error(
          '❌ Google Drive 重新授權失敗：',
          err
        );

        throw err;
      }

      if (!googleDriveAccessToken) {

        throw new Error(
          '沒有取得 Google Drive 授權 Token。\n' +
          '請確認 Google 登入視窗有允許 Drive 權限。'
        );
      }

      console.log(
        '✅ Google Drive Token 取得成功'
      );

      return googleDriveAccessToken;
    }


    /* =========================================================
       Google Drive API
    ========================================================= */

    async function driveApi(
      url,
      options = {}
    ) {

      const token =
        await ensureGoogleDriveToken();

      const headers =
        Object.assign(
          {},
          options.headers || {},
          {
            Authorization:
              `Bearer ${token}`
          }
        );

      const response =
        await fetch(
          url,
          {
            ...options,
            headers
          }
        );

      const responseText =
        await response
          .text()
          .catch(() => '');

      if (response.status === 401) {

        googleDriveAccessToken =
          null;

        throw new Error(
          'Google Drive 授權已失效，請重新操作。'
        );
      }

      if (!response.ok) {

        throw new Error(
          `Google Drive API HTTP ${response.status}\n` +
          responseText
        );
      }

      /*
        模擬 Response，
        讓呼叫端可以照原本方式 response.json()
      */
      return new Response(
        responseText,
        {
          status:
            response.status,

          statusText:
            response.statusText,

          headers:
            response.headers
        }
      );
    }


    /* =========================================================
       Drive Folder
    ========================================================= */

    async function getOrCreateDriveFolder(
      folderName
    ) {

      const safeName =
        folderName.replace(
          /'/g,
          "\\'"
        );

      const query =
        `name = '${safeName}' ` +
        `and mimeType = 'application/vnd.google-apps.folder' ` +
        `and trashed = false`;

      const searchUrl =
        'https://www.googleapis.com/drive/v3/files' +
        '?q=' +
        encodeURIComponent(query) +
        '&spaces=drive' +
        '&fields=files(id,name)';

      const response =
        await driveApi(
          searchUrl
        );

      const data =
        await response.json();

      if (
        data.files &&
        data.files.length
      ) {

        console.log(
          '📁 使用既有 Drive Folder：',
          data.files[0]
        );

        return data.files[0].id;
      }

      const createResponse =
        await driveApi(
          'https://www.googleapis.com/drive/v3/files',
          {
            method: 'POST',

            headers: {
              'Content-Type':
                'application/json'
            },

            body: JSON.stringify({
              name:
                folderName,

              mimeType:
                'application/vnd.google-apps.folder'
            })
          }
        );

      const folder =
        await createResponse.json();

      console.log(
        '📁 建立 Drive Folder：',
        folder
      );

      return folder.id;
    }


    /* =========================================================
       Upload Photo
    ========================================================= */

    async function uploadPhoto(
      file,
      type = 'other'
    ) {

      if (!file) {
        throw new Error(
          '沒有照片檔案'
        );
      }

      console.log(
        '========================================'
      );

      console.log(
        '📤 開始上傳 Google Drive'
      );

      console.log(
        '📤 檔名：',
        file.name
      );

      console.log(
        '📤 大小：',
        file.size
      );

      console.log(
        '📤 類型：',
        file.type
      );

      try {

        const token =
          await ensureGoogleDriveToken();

        console.log(
          '📤 Token OK'
        );

        const folderName =
          '行程照片';

        const folderId =
          await getOrCreateDriveFolder(
            folderName
          );

        const metadata = {

          name:
            `${Date.now()}_${file.name}`,

          parents: [
            folderId
          ],

          mimeType:
            file.type ||
            'application/octet-stream'
        };

        const boundary =
          '-------314159265358979323846';

        const delimiter =
          '\r\n--' +
          boundary +
          '\r\n';

        const closeDelimiter =
          '\r\n--' +
          boundary +
          '--';

        const reader =
          new FileReader();

        const fileBuffer =
          await new Promise(
            (resolve, reject) => {

              reader.onload =
                () =>
                  resolve(
                    reader.result
                  );

              reader.onerror =
                reject;

              reader.readAsArrayBuffer(
                file
              );
            }
          );

        const metadataPart =
          delimiter +
          'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
          JSON.stringify(
            metadata
          );

        const body =
          new Blob(
            [
              metadataPart,

              delimiter +
              `Content-Type: ${file.type || 'application/octet-stream'}\r\n\r\n`,

              fileBuffer,

              closeDelimiter
            ],
            {
              type:
                `multipart/related; boundary="${boundary}"`
            }
          );

        const response =
          await fetch(
            'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink,mimeType,size',
            {
              method: 'POST',

              headers: {
                Authorization:
                  `Bearer ${token}`
              },

              body
            }
          );

        console.log(
          '📤 Drive Upload HTTP：',
          response.status
        );

        const responseText =
          await response
            .text()
            .catch(() => '');

        if (
          response.status === 401
        ) {

          googleDriveAccessToken =
            null;

          throw new Error(
            'Google Drive 授權已過期，請重新操作。'
          );
        }

        if (!response.ok) {

          console.error(
            '❌ Drive Upload Response：',
            responseText
          );

          throw new Error(
            `Google Drive 上傳失敗 HTTP ${response.status}\n${responseText}`
          );
        }

        const uploaded =
          JSON.parse(
            responseText
          );

        console.log(
          '✅ Google Drive 上傳成功：',
          uploaded
        );

        console.log(
          '========================================'
        );

        /*
          重要：
          不公開圖片。
          Firestore 只保存 fileId。

          photoUrl 保留 null，
          讓新架構不依賴 anyone permission。
        */
        return {

          fileId:
            uploaded.id,

          photoUrl:
            null,

          webViewLink:
            uploaded.webViewLink ||
            null
        };

      } catch (err) {

        console.error(
          '❌ uploadPhoto 發生錯誤：',
          err
        );

        console.log(
          '========================================'
        );

        throw err;
      }
    }


    /* =========================================================
       Download Private Drive Photo
    ========================================================= */

    async function getDrivePhotoUrl(
      fileId
    ) {

      console.log(
        '========================================'
      );

      console.log(
        '🖼️ 開始讀取 Google Drive 照片'
      );

      console.log(
        '🖼️ fileId =',
        fileId
      );

      if (!fileId) {

        console.error(
          '❌ 沒有 fileId'
        );

        return null;
      }

      try {

        let token =
          await ensureGoogleDriveToken();

        const url =
          `https://www.googleapis.com/drive/v3/files/` +
          `${encodeURIComponent(fileId)}` +
          `?alt=media`;

        console.log(
          '🖼️ GET：',
          url
        );

        let response =
          await fetch(
            url,
            {
              method: 'GET',

              headers: {
                Authorization:
                  `Bearer ${token}`
              }
            }
          );

        console.log(
          '🖼️ HTTP：',
          response.status
        );

        /*
          Token 過期：
          清掉後重新授權一次，再重試。
        */
        if (
          response.status === 401
        ) {

          console.warn(
            '⚠️ Drive Token 已失效，重新取得'
          );

          googleDriveAccessToken =
            null;

          token =
            await ensureGoogleDriveToken();

          response =
            await fetch(
              url,
              {
                method: 'GET',

                headers: {
                  Authorization:
                    `Bearer ${token}`
                }
              }
            );

          console.log(
            '🖼️ Retry HTTP：',
            response.status
          );
        }

        console.log(
          '🖼️ Content-Type：',
          response.headers.get(
            'Content-Type'
          )
        );

        if (!response.ok) {

          const text =
            await response
              .text()
              .catch(() => '');

          console.error(
            '❌ Drive 圖片下載失敗'
          );

          console.error(
            '❌ HTTP：',
            response.status
          );

          console.error(
            '❌ Response：',
            text
          );

          throw new Error(
            `Google Drive 圖片讀取失敗 HTTP ${response.status}\n${text}`
          );
        }

        console.log(
          '🖼️ 開始取得 Blob'
        );

        const blob =
          await response.blob();

        console.log(
          '🖼️ Blob type：',
          blob.type
        );

        console.log(
          '🖼️ Blob size：',
          blob.size
        );

        if (!blob.size) {

          throw new Error(
            'Google Drive 回傳的圖片是空的'
          );
        }

        const objectUrl =
          URL.createObjectURL(
            blob
          );

        console.log(
          '✅ 圖片 Blob 成功'
        );

        console.log(
          '✅ Object URL：',
          objectUrl
        );

        console.log(
          '========================================'
        );

        return objectUrl;

      } catch (err) {

        console.error(
          '❌ getDrivePhotoUrl 發生錯誤：',
          err
        );

        console.error(
          '========================================'
        );

        return null;
      }
    }

    ========================================================= */

    /*
      由於 trips 是透過 onSnapshot 更新，
      每次資料改變後重新整理目前畫面。
    */

    const originalStartTripSync =
      startTripSync;


    /*
      將 render hook 放在 Snapshot 更新後，
      避免 Firestore 資料變更後 UI 不更新。
    */

    const originalRenderTripsList =
      renderTripsList;


    /*
      不改動原始函式名稱，
      直接用 interval 不合適；
      因此在 startTripSync 的 snapshot 中，
      已經 renderTripsList。

      下面只提供目前畫面的手動刷新工具。
    */

    function refreshCurrentView() {

      if (!currentTripId) {
        renderTripsList();
        return;
      }

      const trip =
        getCurrentTrip();

      if (!trip) {
        showTripsView();
        return;
      }

      renderSchedules();
      renderBuyList();
    }


    /* =========================================================
       Firestore Data Refresh Hook
    ========================================================= */

    /*
      使用 Firebase snapshot 後，
      renderTripsList 已更新。
      如果使用者正在旅程內，
      這裡透過小型 observer 方式檢查目前畫面。
    */

    let lastRenderedTripDataHash = '';

    function getTripDataHash(trip) {

      if (!trip) {
        return '';
      }

      try {

        return JSON.stringify({
          schedules:
            trip.schedules || [],

          buyItems:
            trip.buyItems || []
        });

      } catch (err) {

        return String(
          Date.now()
        );
      }
    }


    setInterval(() => {

      if (!currentTripId) {
        return;
      }

      const trip =
        getCurrentTrip();

      if (!trip) {
        return;
      }

      const hash =
        getTripDataHash(trip);

      if (
        hash !==
        lastRenderedTripDataHash
      ) {

        lastRenderedTripDataHash =
          hash;

        const tripView =
          document.getElementById(
            'trip-view'
          );

        if (
          tripView &&
          tripView.classList.contains(
            'active'
          )
        ) {

          renderSchedules();

          if (
            document
              .getElementById(
                'buy-tab'
              )
              .style.display !==
            'none'
          ) {
            renderBuyList();
          }
        }
      }

    }, 800);

          只保留瀏覽器 session。
