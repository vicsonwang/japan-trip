<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>日本自由行助手 (雲端同步版)</title>
  <style>
    :root {
      --primary-color: #007aff;
      --primary-light: #eef6ff;
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --text-color: #1c1c1e;
      --sub-text: #8e8e93;
      --border-color: #e5e5ea;
      --danger-color: #ff3b30;
      --success-color: #34c759;
      --warning-color: #ff9500;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 90px;
      font-size: 16px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      background: rgba(249, 249, 249, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      font-size: 1.1rem;
      z-index: 100;
    }

    .header-btn {
      background: none;
      border: none;
      color: var(--primary-color);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
    }

    .container {
      padding: 15px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Views & Tabs Switcher */
    .view, .tab-content {
      display: none;
    }
    .view.active, .tab-content.active {
      display: block;
    }

    /* Card Style */
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid rgba(0,0,0,0.03);
    }

    /* Form Controls */
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--sub-text);
      margin-bottom: 6px;
      font-weight: 500;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      background-color: #fff;
      appearance: none;
      -webkit-appearance: none;
    }
    .form-row {
      display: flex;
      gap: 10px;
    }
    .form-row .form-group {
      flex: 1;
    }

    /* 折疊表單設計 */
    .collapsible-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      font-weight: 600;
      color: var(--primary-color);
    }
    .collapsible-body {
      display: none;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px dashed var(--border-color);
    }
    .collapsible-body.show {
      display: block;
    }

    /* Buttons */
    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      text-align: center;
    }
    .btn-sm {
      padding: 5px 10px;
      font-size: 0.8rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-edit {
      background-color: #e5e5ea;
      color: #1c1c1e;
    }
    .btn-danger {
      background-color: rgba(255, 59, 48, 0.1);
      color: var(--danger-color);
    }
    .btn-action-group {
      display: flex;
      gap: 6px;
    }

    /* Bottom Navigation Bar */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(249, 249, 249, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
      z-index: 1000;
    }
    .nav-item {
      flex: 1;
      text-align: center;
      color: var(--sub-text);
      font-size: 0.75rem;
      text-decoration: none;
      border: none;
      background: none;
      cursor: pointer;
    }
    .nav-item.active {
      color: var(--primary-color);
      font-weight: 600;
    }
    .nav-icon {
      font-size: 1.4rem;
      display: block;
      margin-bottom: 2px;
    }

    /* 行程美化卡片 */
    .sch-card {
      position: relative;
      border-left: 4px solid var(--primary-color);
      padding-left: 14px;
    }
    .sch-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .day-badge {
      background: var(--primary-color);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .date-text {
      font-size: 0.85rem;
      color: var(--sub-text);
      margin-left: 6px;
      font-weight: 500;
    }
    .sch-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-color);
      margin-bottom: 6px;
    }
    .sch-time {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.85rem;
      color: var(--primary-color);
      background: var(--primary-light);
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .sch-note {
      font-size: 0.85rem;
      color: #636366;
      margin-top: 6px;
      background: #f8f8fa;
      padding: 6px 10px;
      border-radius: 6px;
    }

    /* Proxy Buy Specifics */
    .buy-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .buy-item.bought .sch-title {
      text-decoration: line-through;
      color: var(--sub-text);
    }
    .checkbox-custom {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .checkbox-custom.checked {
      background-color: var(--success-color);
      border-color: var(--success-color);
      color: white;
    }
    .checkbox-custom.checked::after {
      content: '✓';
      font-size: 14px;
      font-weight: bold;
    }

    .rate-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--primary-light);
      padding: 10px 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .rate-bar input {
      width: 80px;
      padding: 4px 8px;
      text-align: right;
    }

    .trip-card {
      cursor: pointer;
      border-left: 5px solid var(--primary-color);
    }

    .sync-status {
      font-size: 0.75rem;
      color: var(--success-color);
      text-align: center;
      margin-bottom: 10px;
    }

    /* Modal 彈窗樣式 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 20px;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal-card {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--sub-text);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <button id="back-to-trips-btn" class="header-btn" style="visibility: hidden;" onclick="showTripsView()">
      ‹ 返回旅程
    </button>
    <span id="header-title">日本自由行</span>
    <span style="width: 70px;"></span>
  </header>

  <div class="container">
    <div id="sync-notice" class="sync-status">🟢 雲端連線同步中</div>

    <!-- 第一頁：旅程選擇頁 (首頁) -->
    <div id="view-trips" class="view active">
      <div class="card">
        <div class="collapsible-header" onclick="toggleCollapsible('trip-form-body', 'trip-form-icon')">
          <span>➕ 新增自由行程</span>
          <span id="trip-form-icon">＋</span>
        </div>
        <div id="trip-form-body" class="collapsible-body">
          <form id="trip-form">
            <div class="form-group">
              <label>旅程名稱</label>
              <input type="text" id="trip-name" placeholder="例如：東京 6 天 5 夜自由行" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>開始日期</label>
                <input type="date" id="trip-start-date" required>
              </div>
              <div class="form-group">
                <label>結束日期</label>
                <input type="date" id="trip-end-date" required>
              </div>
            </div>
            <button type="submit" class="btn">建立旅程</button>
          </form>
        </div>
      </div>

      <h3 style="margin: 15px 5px 10px; font-size: 0.9rem; color: var(--sub-text);">我的旅程清單</h3>
      <div id="trips-list"></div>
    </div>

    <!-- 第二頁：行程與代購細項 -->
    <div id="view-detail" class="view">
      
      <!-- 1. 行程細項 Tab -->
      <div id="tab-schedule" class="tab-content">
        <div class="card">
          <div class="collapsible-header" onclick="toggleCollapsible('sch-form-body', 'sch-form-icon')">
            <span>➕ 新增行程細項</span>
            <span id="sch-form-icon">＋</span>
          </div>
          <div id="sch-form-body" class="collapsible-body">
            <form id="schedule-form">
              <div class="form-row">
                <div class="form-group">
                  <label>日期</label>
                  <input type="date" id="sch-date" required>
                </div>
                <div class="form-group">
                  <label>天數 (如: Day 1)</label>
                  <input type="text" id="sch-day" placeholder="Day 1" required>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>開始時間</label>
                  <input type="time" id="sch-start" required>
                </div>
                <div class="form-group">
                  <label>結束時間</label>
                  <input type="time" id="sch-end" required>
                </div>
              </div>
              <div class="form-group">
                <label>地點 / 景點 / 行程內容</label>
                <input type="text" id="sch-place" placeholder="例如：成田機場 ✈️ 福岡機場" required>
              </div>
              <div class="form-group">
                <label>備註 / 停留時間</label>
                <input type="text" id="sch-duration" placeholder="例如：記得出示 Visit Japan Web QR Code">
              </div>
              <button type="submit" class="btn">新增行程</button>
            </form>
          </div>
        </div>

        <div id="schedule-list"></div>
      </div>

      <!-- 2. 代購 Tab -->
      <div id="tab-buy" class="tab-content">
        <div class="rate-bar">
          <span>🇯🇵 日幣換算台幣匯率：</span>
          <input type="number" id="exchange-rate" step="0.001" value="0.21" onchange="updateRate()">
        </div>

        <div class="card">
          <h3 style="margin-bottom: 10px; font-size: 0.85rem; color: var(--sub-text);">🔍 條件篩選</h3>
          <div class="form-row">
            <div class="form-group">
              <label>分類</label>
              <select id="filter-category" onchange="renderBuyList()">
                <option value="ALL">全部分類</option>
                <option value="藥妝">藥妝</option>
                <option value="零食">零食</option>
                <option value="動漫/玩具">動漫/玩具</option>
                <option value="電器">電器</option>
                <option value="服飾">服飾</option>
                <option value="其他">其他</option>
              </select>
            </div>
            <div class="form-group">
              <label>購買狀態</label>
              <select id="filter-status" onchange="renderBuyList()">
                <option value="ALL">全部狀態</option>
                <option value="UNBOUGHT">未購買</option>
                <option value="BOUGHT">已購買</option>
              </select>
            </div>
            <div class="form-group">
              <label>委託人</label>
              <select id="filter-owner" onchange="renderBuyList()">
                <option value="ALL">全部委託人</option>
              </select>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="collapsible-header" onclick="toggleCollapsible('buy-form-body', 'buy-form-icon')">
            <span>➕ 新增代購商品</span>
            <span id="buy-form-icon">＋</span>
          </div>
          <div id="buy-form-body" class="collapsible-body">
            <form id="buy-form">
              <div class="form-group">
                <label>商品名稱</label>
                <input type="text" id="buy-name" placeholder="例如：合利他命 EX" required>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>分類</label>
                  <select id="buy-category">
                    <option value="藥妝">藥妝</option>
                    <option value="零食">零食</option>
                    <option value="動漫/玩具">動漫/玩具</option>
                    <option value="電器">電器</option>
                    <option value="服飾">服飾</option>
                    <option value="其他">其他</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>數量</label>
                  <input type="number" id="buy-qty" value="1" min="1" required>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>日幣單價 (円)</label>
                  <input type="number" id="buy-price" placeholder="5000" required>
                </div>
                <div class="form-group">
                  <label>委託人</label>
                  <input type="text" id="buy-owner" placeholder="例如：小明" required>
                </div>
              </div>
              <button type="submit" class="btn">新增代購項</button>
            </form>
          </div>
        </div>

        <div id="buy-list"></div>
      </div>

    </div>

  </div>

  <!-- 編輯行程 Modal -->
  <div id="edit-sch-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <span>✏️ 編輯行程細項</span>
        <button class="modal-close" onclick="closeModal('edit-sch-modal')">✕</button>
      </div>
      <form id="edit-sch-form">
        <input type="hidden" id="edit-sch-id">
        <div class="form-row">
          <div class="form-group">
            <label>日期</label>
            <input type="date" id="edit-sch-date" required>
          </div>
          <div class="form-group">
            <label>天數</label>
            <input type="text" id="edit-sch-day" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>開始時間</label>
            <input type="time" id="edit-sch-start" required>
          </div>
          <div class="form-group">
            <label>結束時間</label>
            <input type="time" id="edit-sch-end" required>
          </div>
        </div>
        <div class="form-group">
          <label>地點 / 景點 / 行程內容</label>
          <input type="text" id="edit-sch-place" required>
        </div>
        <div class="form-group">
          <label>備註 / 停留時間</label>
          <input type="text" id="edit-sch-duration">
        </div>
        <button type="submit" class="btn">儲存變更</button>
      </form>
    </div>
  </div>

  <!-- 編輯代購 Modal -->
  <div id="edit-buy-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <span>✏️ 編輯代購商品</span>
        <button class="modal-close" onclick="closeModal('edit-buy-modal')">✕</button>
      </div>
      <form id="edit-buy-form">
        <input type="hidden" id="edit-buy-id">
        <div class="form-group">
          <label>商品名稱</label>
          <input type="text" id="edit-buy-name" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>分類</label>
            <select id="edit-buy-category">
              <option value="藥妝">藥妝</option>
              <option value="零食">零食</option>
              <option value="動漫/玩具">動漫/玩具</option>
              <option value="電器">電器</option>
              <option value="服飾">服飾</option>
              <option value="其他">其他</option>
            </select>
          </div>
          <div class="form-group">
            <label>數量</label>
            <input type="number" id="edit-buy-qty" min="1" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>日幣單價 (円)</label>
            <input type="number" id="edit-buy-price" required>
          </div>
          <div class="form-group">
            <label>委託人</label>
            <input type="text" id="edit-buy-owner" required>
          </div>
        </div>
        <button type="submit" class="btn">儲存變更</button>
      </form>
    </div>
  </div>

  <!-- 底部分頁導覽列 -->
  <nav id="detail-nav-bar" class="nav-bar" style="display: none;">
    <button class="nav-item active" onclick="switchTab('schedule')">
      <span class="nav-icon">🗺️</span>
      行程規劃
    </button>
    <button class="nav-item" onclick="switchTab('buy')">
      <span class="nav-icon">🛍️</span>
      代購清單
    </button>
  </nav>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // 您的 Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyDCNbwIV1iMoxwlPL7a4xEbMwpMv75sOak",
      authDomain: "japan-trip-701cd.firebaseapp.com",
      projectId: "japan-trip-701cd",
      storageBucket: "japan-trip-701cd.firebasestorage.app",
      messagingSenderId: "811979985418",
      appId: "1:811979985418:web:e3e93cf122f780af4585f3",
      measurementId: "G-62BVTK2QEZ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let trips = [];
    let currentTripId = null;
    let exchangeRate = 0.21;

    // Realtime Sync
    db.collection("trips").onSnapshot(snapshot => {
      trips = [];
      snapshot.forEach(doc => {
        trips.push({ id: doc.id, ...doc.data() });
      });
      renderTripsList();
      if (currentTripId) {
        renderSchedules();
        updateOwnerFilterOptions();
        renderBuyList();
      }
    });

    db.collection("settings").doc("rate").onSnapshot(doc => {
      if (doc.exists) {
        exchangeRate = doc.data().val || 0.21;
        document.getElementById('exchange-rate').value = exchangeRate;
        if (currentTripId) renderBuyList();
      }
    });

    // 折疊表單控制
    function toggleCollapsible(bodyId, iconId) {
      const body = document.getElementById(bodyId);
      const icon = document.getElementById(iconId);
      const isOpen = body.classList.contains('show');
      body.classList.toggle('show', !isOpen);
      icon.innerText = isOpen ? '＋' : '✕';
    }

    // Modal 控制
    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('show');
    }

    // 頁面切換
    function showTripsView() {
      currentTripId = null;
      document.getElementById('view-trips').classList.add('active');
      document.getElementById('view-detail').classList.remove('active');
      document.getElementById('detail-nav-bar').style.display = 'none';
      document.getElementById('back-to-trips-btn').style.visibility = 'hidden';
      document.getElementById('header-title').innerText = '日本自由行';
      renderTripsList();
    }

    function openTripDetail(tripId) {
      currentTripId = tripId;
      const trip = trips.find(t => t.id === tripId);
      if (!trip) return;

      document.getElementById('view-trips').classList.remove('active');
      document.getElementById('view-detail').classList.add('active');
      document.getElementById('detail-nav-bar').style.display = 'flex';
      document.getElementById('back-to-trips-btn').style.visibility = 'visible';
      document.getElementById('header-title').innerText = trip.name;

      switchTab('schedule');
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('#detail-nav-bar .nav-item').forEach(el => el.classList.remove('active'));

      if (tabName === 'schedule') {
        document.getElementById('tab-schedule').classList.add('active');
        document.querySelectorAll('#detail-nav-bar .nav-item')[0].classList.add('active');
        renderSchedules();
      } else {
        document.getElementById('tab-buy').classList.add('active');
        document.querySelectorAll('#detail-nav-bar .nav-item')[1].classList.add('active');
        updateOwnerFilterOptions();
        renderBuyList();
      }
    }

    // 1. 旅程管理
    document.getElementById('trip-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const newTrip = {
        name: document.getElementById('trip-name').value.trim(),
        startDate: document.getElementById('trip-start-date').value,
        endDate: document.getElementById('trip-end-date').value,
        schedules: [],
        buyItems: []
      };
      db.collection("trips").add(newTrip);
      this.reset();
      toggleCollapsible('trip-form-body', 'trip-form-icon');
    });

    function deleteTrip(id, e) {
      e.stopPropagation();
      if (confirm('確定要刪除整個旅程嗎？')) {
        db.collection("trips").doc(id).delete();
      }
    }

    function renderTripsList() {
      const listEl = document.getElementById('trips-list');
      listEl.innerHTML = '';

      if (trips.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; color:var(--sub-text); padding:30px 0;">尚無旅程，請點擊上方 + 新增自由行程</div>';
        return;
      }

      trips.forEach(trip => {
        const card = document.createElement('div');
        card.className = 'card trip-card';
        card.onclick = () => openTripDetail(trip.id);
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <span style="font-size:1.15rem; font-weight:700;">${trip.name}</span>
            <button class="btn-sm btn-danger" onclick="deleteTrip('${trip.id}', event)">刪除</button>
          </div>
          <div style="font-size:0.85rem; color:var(--sub-text);">🗓️ ${trip.startDate} ～ ${trip.endDate}</div>
        `;
        listEl.appendChild(card);
      });
    }

    // 2. 行程細項管理
    document.getElementById('schedule-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const trip = trips.find(t => t.id === currentTripId);
      if (!trip) return;

      const newItem = {
        id: Date.now(),
        date: document.getElementById('sch-date').value,
        day: document.getElementById('sch-day').value.trim(),
        startTime: document.getElementById('sch-start').value,
        endTime: document.getElementById('sch-end').value,
        place: document.getElementById('sch-place').value.trim(),
        duration: document.getElementById('sch-duration').value.trim()
      };

      const updatedSchedules = [...(trip.schedules || []), newItem];
      // 按日期與時間排序
      updatedSchedules.sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));

      db.collection("trips").doc(currentTripId).update({ schedules: updatedSchedules });
      this.reset();
      toggleCollapsible('sch-form-body', 'sch-form-icon');
    });

    function openEditSchedule(id) {
      const trip = trips.find(t => t.id === currentTripId);
      if (!trip) return;
      const item = trip.schedules.find(s => s.id === id);
      if (!item) return;

      document.getElementById('edit-sch-id').value = item.id;
      document.getElementById('edit-sch-date').value = item.date;
      document.getElementById('edit-sch-day').value = item.day;
      document.getElementById('edit-sch-start').value = item.startTime;
      document.getElementById('edit-sch-end').value = item.endTime;
      document.getElementById('edit-sch-place').value = item.place;
      document.getElementById('edit-sch-duration').value = item.duration || '';

      document.getElementById('edit-sch-modal').classList.add('show');
    }

    document.getElementById('edit-sch-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const trip = trips.find(t => t.id === currentTripId);
      if (!trip) return;

      const id = parseInt(document.getElementById('edit-sch-id').value);
      const updatedSchedules = trip.schedules.map(item => {
        if (item.id === id) {
          return {
            id: id,
            date: document.getElementById('edit-sch-date').value,
            day: document.getElementById('edit-sch-day').value.trim(),
            startTime: document.getElementById('edit-sch-start').value,
            endTime: document.getElementById('edit-sch-end').value,
            place: document.getElementById('edit-sch-place').value.trim(),
            duration: document.getElementById('edit-sch-duration').value.trim()
          };
        }
        return item;
      });

      updatedSchedules.sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));

      db.collection("trips").doc(currentTripId).update({ schedules: updatedSchedules });
      closeModal('edit-sch-modal');
    });

    function deleteSchedule(id) {
      if (confirm('確定刪除此行程細項？')) {
        const trip = trips.find(t => t.id === currentTripId);
        if (trip) {
          const updatedSchedules = trip.schedules.filter(s => s.id !== id);
          db.collection("trips").doc(currentTripId).update({ schedules: updatedSchedules });
        }
      }
    }

    function renderSchedules() {
      const listEl = document.getElementById('schedule-list');
      listEl.innerHTML = '';
      const trip = trips.find(t => t.id === currentTripId);
      if (!trip || !trip.schedules || trip.schedules.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; color:var(--sub-text); padding:30px 0;">尚無行程細項，點擊上方 + 號新增</div>';
        return;
      }

      // 確保按時間排序
      const sortedSchedules = [...trip.schedules].sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));

      sortedSchedules.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card sch-card';
        card.innerHTML = `
          <div class="sch-top-bar">
            <div>
              <span class="day-badge">${item.day}</span>
              <span class="date-text">${item.date}</span>
            </div>
            <div class="btn-action-group">
              <button class="btn-sm btn-edit" onclick="openEditSchedule(${item.id})">編輯</button>
              <button class="btn-sm btn-danger" onclick="deleteSchedule(${item.id})">刪除</button>
            </div>
          </div>
          <div class="sch-title">${item.place}</div>
          <div style="margin-top: 4px;">
            <span class="sch-time">⏰ ${item.startTime} ～ ${item.endTime}</span>
          </div>
          ${item.duration ? `<div class="sch-note">📌 ${item.duration}</div>` : ''}
        `;
        listEl.appendChild(card);
      });
    }

    // 3. 代購管理
    function updateRate() {
      const val = parseFloat(document.getElementById('exchange-rate').value);
      if (!isNaN(val) && val > 0) {
        db.collection("settings").doc("rate").set({ val: val });
      }
    }

    document.getElementById('buy-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const trip = trips.find(t => t.id === currentTripId);
      if (!trip) return;

      const newItem = {
        id: Date.now(),
        name: document.getElementById('buy-name').value.trim(),
        category: document.getElementById('buy-category').value,
        qty: parseInt(document.getElementById('buy-qty').value),
        priceJpy: parseFloat(document.getElementById('buy-price').value),
        owner: document.getElementById('buy-owner').value.trim(),
        bought: false
      };

      const updatedBuyItems = [...(trip.buyItems || []), newItem];
      db.collection("trips").doc(currentTripId).update({ buyItems: updatedBuyItems });
      this.reset();
      toggleCollapsible('buy-form-body', 'buy-form-icon');
    });

    function openEditBuyItem(id) {
      const trip = trips.find(t => t.id === currentTripId);
      if (!trip) return;
      const item = trip.buyItems.find(i => i.id === id);
      if (!item) return;

      document.getElementById('edit-buy-id').value = item.id;
      document.getElementById('edit-buy-name').value = item.name;
      document.getElementById('edit-buy-category').value = item.category;
      document.getElementById('edit-buy-qty').value = item.qty;
      document.getElementById('edit-buy-price').value = item.priceJpy;
      document.getElementById('edit-buy-owner').value = item.owner;

      document.getElementById('edit-buy-modal').classList.add('show');
    }

    document.getElementById('edit-buy-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const trip = trips.find(t => t.id === currentTripId);
      if (!trip) return;

      const id = parseInt(document.getElementById('edit-buy-id').value);
      const updatedBuyItems = trip.buyItems.map(item => {
        if (item.id === id) {
          return {
            ...item,
            name: document.getElementById('edit-buy-name').value.trim(),
            category: document.getElementById('edit-buy-category').value,
            qty: parseInt(document.getElementById('edit-buy-qty').value),
            priceJpy: parseFloat(document.getElementById('edit-buy-price').value),
            owner: document.getElementById('edit-buy-owner').value.trim()
          };
        }
        return item;
      });

      db.collection("trips").doc(currentTripId).update({ buyItems: updatedBuyItems });
      closeModal('edit-buy-modal');
    });

    function toggleBought(id) {
      const trip = trips.find(t => t.id === currentTripId);
      if (trip && trip.buyItems) {
        const updatedBuyItems = trip.buyItems.map(item => {
          if (item.id === id) return { ...item, bought: !item.bought };
          return item;
        });
        db.collection("trips").doc(currentTripId).update({ buyItems: updatedBuyItems });
      }
    }

    function deleteBuyItem(id) {
      if (confirm('確定刪除此代購商品？')) {
        const trip = trips.find(t => t.id === currentTripId);
        if (trip && trip.buyItems) {
          const updatedBuyItems = trip.buyItems.filter(i => i.id !== id);
          db.collection("trips").doc(currentTripId).update({ buyItems: updatedBuyItems });
        }
      }
    }

    function updateOwnerFilterOptions() {
      const select = document.getElementById('filter-owner');
      const currentVal = select.value;
      const trip = trips.find(t => t.id === currentTripId);
      const items = (trip && trip.buyItems) ? trip.buyItems : [];
      const owners = [...new Set(items.map(i => i.owner))];

      select.innerHTML = '<option value="ALL">全部委託人</option>';
      owners.forEach(owner => {
        const opt = document.createElement('option');
        opt.value = owner;
        opt.innerText = owner;
        select.appendChild(opt);
      });
      select.value = currentVal;
    }

    function renderBuyList() {
      const listEl = document.getElementById('buy-list');
      listEl.innerHTML = '';
      const trip = trips.find(t => t.id === currentTripId);
      const items = (trip && trip.buyItems) ? trip.buyItems : [];

      const catFilter = document.getElementById('filter-category').value;
      const statusFilter = document.getElementById('filter-status').value;
      const ownerFilter = document.getElementById('filter-owner').value;

      let filtered = items.filter(item => {
        if (catFilter !== 'ALL' && item.category !== catFilter) return false;
        if (statusFilter === 'BOUGHT' && !item.bought) return false;
        if (statusFilter === 'UNBOUGHT' && item.bought) return false;
        if (ownerFilter !== 'ALL' && item.owner !== ownerFilter) return false;
        return true;
      });

      // 預設將未買的排在前面，已買的排後面
      filtered.sort((a, b) => (a.bought === b.bought ? 0 : a.bought ? 1 : -1));

      if (filtered.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; color:var(--sub-text); padding:30px 0;">無符合條件的代購項目</div>';
        return;
      }

      filtered.forEach(item => {
        const twpTotal = Math.round(item.priceJpy * item.qty * exchangeRate);
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="buy-item ${item.bought ? 'bought' : ''}">
            <div class="checkbox-custom ${item.bought ? 'checked' : ''}" onclick="toggleBought(${item.id})"></div>
            <div style="flex: 1;">
              <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px;">
                <span class="sch-title" style="font-size:1.05rem;">${item.name}</span>
                <div class="btn-action-group">
                  <button class="btn-sm btn-edit" onclick="openEditBuyItem(${item.id})">編輯</button>
                  <button class="btn-sm btn-danger" onclick="deleteBuyItem(${item.id})">刪除</button>
                </div>
              </div>
              <div style="margin-bottom: 6px;">
                <span class="tag">${item.category}</span>
                <span class="tag" style="background:#e3f2fd; color:#0d47a1;">👤 ${item.owner}</span>
              </div>
              <div style="font-size:0.85rem; color:var(--sub-text);">
                數量: <b>${item.qty}</b> | 單價: ¥${item.priceJpy.toLocaleString()}
              </div>
              <div style="margin-top: 4px; font-weight: 700; color: #d32f2f; font-size:0.95rem;">
                約 NT$ ${twpTotal.toLocaleString()}
              </div>
            </div>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    renderTripsList();
  </script>
</body>
</html>
